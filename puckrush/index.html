  const blk=Math.floor(z/8), col=(blk%2===0)?TH.ledA:TH.ledB;\n      const a=proj(bx,0.004,z), b=proj(bx - s*0.42,0.004,z+3.4);\n      if(!a||!b) continue;\n      const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);\n      g.addColorStop(0,hexA(col,0.26*alr)); g.addColorStop(1,hexA(col,0));\n      ctx.strokeStyle=g; ctx.lineWidth=Math.max(1.5,Math.min(16,a.s*0.03)); ctx.lineCap='round';\n      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();\n    }\n  }\n  ctx.restore();\n  // overhead lights reflected as long soft pools stretched toward the camera\n  ctx.save();\n  for(const z of lightZs()){\n    if(z < CAM.z+6) continue;\n    const nearP=proj(0,0.004,z-2.6), farP=proj(0,0.004,z+2.6);\n    if(!nearP||!farP) continue;\n    const alr=fogA(z,1)*0.42; if(alr<=0.03) continue;\n    const g=ctx.createLinearGradient(farP.x,farP.y,nearP.x,nearP.y);\n    g.addColorStop(0,hexA(TH.light,0));\n    g.addColorStop(0.45,hexA(TH.light,alr*0.55));\n    g.addColorStop(1,hexA(TH.light,0));\n    ctx.strokeStyle=g; ctx.lineWidth=Math.max(2,Math.min(30,nearP.s*0.055)); ctx.lineCap='round';\n    ctx.beginPath(); ctx.moveTo(farP.x,farP.y); ctx.lineTo(nearP.x,nearP.y); ctx.stroke();\n  }\n  ctx.restore();\n  // broad polish streaks running with the skate direction\n  ctx.save();\n  for(let k=0;k<7;k++){\n    const lx=-RINK*0.85 + k*(RINK*1.7/6) + Math.sin(k*2.3)*0.08;\n    const a=proj(lx,0.003,CAM.z+5), b=proj(lx*0.9,0.003,CAM.z+52);\n    if(!a||!b) continue;\n    const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);\n    g.addColorStop(0,hexA(TH.light,0.055)); g.addColorStop(0.5,hexA(TH.light,0.03)); g.addColorStop(1,hexA(TH.light,0));\n    ctx.strokeStyle=g; ctx.lineWidth=Math.max(2,Math.min(26,a.s*0.05)); ctx.lineCap='round';\n    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();\n  }\n  ctx.restore();\n  // glossy near-field sheen\n  { const g2=ctx.createLinearGradient(0,H*0.84,0,H);\n    g2.addColorStop(0,hexA(TH.light,0)); g2.addColorStop(1,hexA(TH.light,.10));\n    ctx.fillStyle=g2; ctx.fillRect(0,H*0.84,W,H*0.16); }\n}\nfunction drawGoal(){\n  const z=G._z+108;\n  const A=proj(-0.95,1.05,z), B=proj(0.95,1.05,z), Cc=proj(0.95,0,z), D=proj(-0.95,0,z);\n  if(!A||!B) return;\n  quad(A,B,Cc,D,'rgba(77,227,255,.05)',null);\n  neonLine(-0.95,0,z,-0.95,1.05,z,C.neonCyan,1.4,true);\n  neonLine(0.95,0,z,0.95,1.05,z,C.neonCyan,1.4,true);\n  neonLine(-0.95,1.05,z,0.95,1.05,z,C.neonCyan,1.4,true);\n}\n/* beveled slab with a single glowing edge — the shared obstacle/prop language */\nfunction slab(x,y0,z,w,h,d,accent,accentSide){\n  const face=fogc(C.slab,z), top=fogc(C.slabTop,z), side=fogc(C.boardDark,z);\n  box(x,y0,z,w,h,d,face,top,side);\n  const t=proj(x,y0+h,z);\n  if(t && fogA(z,1)>0.2){\n    if(accentSide==='top') neonLine(x-w/2,y0+h,z,x+w/2,y0+h,z,accent,Math.max(1.2,t.s*0.022),true);\n    else { neonLine(x-w*0.34,y0+h*0.92,z,x-w*0.34,y0+h*0.12,z,accent,Math.max(1.2,t.s*0.02),true);\n           neonLine(x+w*0.34,y0+h*0.92,z,x+w*0.34,y0+h*0.12,z,accent,Math.max(1.2,t.s*0.02),true); }\n  }\n}\nfunction drawBoards(){\n  const zN=CAM.z+0.45, zF=CAM.z+80;\n  const zs=zSamples(zN,zF,26);\n  const rinkWhite=mix('#eef4ff', TH.horizon, 0.04);\n  const rinkShade=mix('#c6d3ea', TH.horizon, 0.10);\n  const bands=[\n    {y0:0.20, y1:0.78, col:rinkWhite},     // white dasher board\n    {y0:0.00, y1:0.20, col:rinkShade}      // shaded kick strip\n  ];\n  for(const s of [-1,1]){\n    const x=s*RINK;\n    for(const b of bands){\n      const top=[], bot=[];\n      for(const z of zs){\n        const pt=proj(x,b.y1,z), pb=proj(x,b.y0,z);\n        if(pt&&pb){ top.push(pt); bot.push(pb); }\n      }\n      if(top.length<2) continue;\n      ctx.beginPath();\n      ctx.moveTo(top[0].x, top[0].y);\n      for(let i=1;i<top.length;i++) ctx.lineTo(top[i].x, top[i].y);\n      for(let i=bot.length-1;i>=0;i--) ctx.lineTo(bot[i].x, bot[i].y);\n      ctx.closePath();\n      const g=ctx.createLinearGradient(top[0].x,top[0].y,top[top.length-1].x,top[top.length-1].y);\n      g.addColorStop(0, b.col);\n      g.addColorStop(0.16, mix(b.col, TH.horizon, 0.18));\n      g.addColorStop(0.45, mix(b.col, TH.horizon, 0.55));\n      g.addColorStop(1, TH.horizon);\n      ctx.fillStyle=g; ctx.fill();\n    }\n    // dark cap rail along the top of the boards\n    const cap=[], capIn=[];\n    for(const z of zs){\n      const a=proj(x,0.82,z), c=proj(x - s*0.14,0.82,z);\n      if(a&&c){ cap.push(a); capIn.push(c); }\n    }\n    if(cap.length>1){\n      ctx.beginPath(); ctx.moveTo(cap[0].x,cap[0].y);\n      for(let i=1;i<cap.length;i++) ctx.lineTo(cap[i].x,cap[i].y);\n      for(let i=capIn.length-1;i>=0;i--) ctx.lineTo(capIn[i].x,capIn[i].y);\n      ctx.closePath();\n      const cg=ctx.createLinearGradient(cap[0].x,cap[0].y,cap[cap.length-1].x,cap[cap.length-1].y);\n      cg.addColorStop(0, mix('#26303f', TH.horizon, 0.1));\n      cg.addColorStop(1, TH.horizon);\n      ctx.fillStyle=cg; ctx.fill();\n    }\n    // board face line where the two bands meet\n    runLine(x,0.20,zN,zF,Math.max(1,Math.min(3,(proj(x,0.2,zN)||{s:6}).s*0.003)),0,'#8fa2bf','#8fa2bf',0.35);\n    // LED run in the kick strip: alternating blocks, stroked span by span\n    const near=proj(x,0.10,zN);\n    const wid=near?Math.min(7,Math.max(1.4,near.s*0.006)):2;\n    ctx.save(); ctx.globalAlpha=0.30;\n    runLine(x,0.10,zN,zF,wid*3.2,8,TH.ledA,TH.ledB,0.55);\n    ctx.restore();\n    runLine(x,0.10,zN,zF,wid,8,TH.ledA,TH.ledB,1);\n  }\n}\nfunction drawTunnel(){\n  const amt=TH.tunnel; if(amt<0.02) return;\n  const ROOF=3.1, base=Math.floor((CAM.z+4)/2)*2;\n  ctx.save();\n  for(let i=40;i>=0;i--){\n    const z=base+i*2, al=fogA(z,1)*amt; if(al<=0.02 || z < CAM.z+3.6) continue;\n    ctx.globalAlpha=al;\n    for(const s of [-1,1]){\n      const x=s*RINK;\n      const A=proj(x,ROOF,z), B=proj(x,ROOF,z+2), Cc=proj(x,0.82,z+2), D=proj(x,0.82,z);\n      if(A&&B) quad(A,B,Cc,D, fogc(TH.boardFace,z,0.7), null);\n    }\n    const R1=proj(-RINK,ROOF,z), R2=proj(RINK,ROOF,z), R3=proj(RINK,ROOF,z+2), R4=proj(-RINK,ROOF,z+2);\n    if(R1) quad(R1,R2,R3,R4, fogc(TH.bgMid,z,0.75), null);\n    // ribs every 6m\n    if (Math.floor(z)%6===0){\n      ctx.globalAlpha=1;\n      neonLine(-RINK,ROOF-0.06,z,RINK,ROOF-0.06,z,TH.ledA,Math.max(1,(R1?R1.s:6)*0.012),al>0.35);\n      neonLine(-RINK,0.82,z,-RINK,ROOF-0.06,z,TH.ledA,Math.max(1,(R1?R1.s:6)*0.01),false);\n      neonLine(RINK,0.82,z,RINK,ROOF-0.06,z,TH.ledA,Math.max(1,(R1?R1.s:6)*0.01),false);\n      ctx.globalAlpha=al;\n    }\n  }\n  ctx.restore(); ctx.globalAlpha=1;\n}\nfunction drawMotes(){\n  const list=G.motes;\n  for(let i=0;i<list.length;i++){\n    const m=list[i], t=proj(m.x,m.y,m.z); if(!t) continue;\n    const al=fogA(m.z,1)*0.75*(0.6+0.4*Math.sin(G.t*2+m.z));\n    if(al<=0.02) continue;\n    ctx.globalAlpha=al; ctx.fillStyle=m.col;\n    ctx.beginPath(); ctx.arc(t.x,t.y,Math.max(0.8,Math.min(5,t.s*m.r)),0,7); ctx.fill();\n  }\n  ctx.globalAlpha=1;\n}\nfunction drawProps(){\n  const list=G.props.filter(p=>p.z>CAM.z+4.5).sort((a,b)=>b.z-a.z);\n  for(const p of list){\n    const al=fogA(p.z,1); if(al<=0.02) continue;\n    if(p.type==='tower'){\n      if(p.z < CAM.z+10) continue;\n      // stepped chunky mass\n      box(p.x,0,p.z,p.w*1.12,p.h*0.22,p.w*0.95, fogc(C.slab,p.z), fogc(C.slabTop,p.z), fogc(C.boardDark,p.z));\n      box(p.x,p.h*0.22,p.z+0.06,p.w,p.h*0.78,p.w*0.82, fogc(C.slab,p.z), fogc(C.slabTop,p.z), fogc(C.boardDark,p.z));\n      const t=proj(p.x,p.h,p.z);\n      if(t&&al>0.10){\n        for(let k=0;k<p.bars;k++){\n          const ox=p.x+(p.bars===1?0:(k?0.26:-0.26))*p.w;\n          neonLine(ox,p.h*0.32,p.z,ox,p.h*0.94,p.z,p.col,Math.max(2,Math.min(9,t.s*0.05)),al>0.3);\n        }\n      }\n    } else if(p.type==='disc'){\n      if(p.z < CAM.z+10) continue;\n      const t=proj(p.x,p.h,p.z); if(!t) continue;\n      // mast\n      box(p.x,0,p.z,0.16,p.h,0.16, fogc(C.boardDark,p.z), fogc(C.slabTop,p.z), fogc(C.ink,p.z));\n      if(al>0.08){\n        neonLine(p.x,p.h,p.z,p.x,p.h+0.95,p.z,C.neonBlue,Math.max(1.6,Math.min(7,t.s*0.035)),al>0.3);\n        // fat cylinder cap\n        const rTop=p.rad, hCyl=0.42;\n        const A=proj(p.x-rTop,p.h+hCyl,p.z), B=proj(p.x+rTop,p.h+hCyl,p.z),\n              Cc=proj(p.x+rTop,p.h,p.z), D=proj(p.x-rTop,p.h,p.z);\n        quad(A,B,Cc,D, fogc(C.slab,p.z), null);\n        const tt=proj(p.x,p.h+hCyl,p.z);\n        if(tt){\n          ctx.globalAlpha=al;\n          const rx=Math.abs(tt.s*rTop), ry=rx*0.30;\n          const g=ctx.createLinearGradient(tt.x,tt.y-ry,tt.x,tt.y+ry);\n          ctx.fillStyle=fogc(mix(C.slabTop,'#3b4a6e',0.5),p.z);\n          ctx.beginPath(); ctx.ellipse(tt.x,tt.y,rx,ry,0,0,7); ctx.fill();\n          ctx.strokeStyle=hexA(p.col,.85); ctx.lineWidth=Math.max(1.4,Math.min(6,rx*0.07));\n          ctx.beginPath(); ctx.ellipse(tt.x,tt.y,rx,ry,0,0,7); ctx.stroke();\n          // glowing rim round the base of the cylinder\n          const cb=proj(p.x,p.h,p.z);\n          if(cb){ const rx2=Math.abs(cb.s*rTop), ry2=rx2*0.30;\n            ctx.strokeStyle=hexA(p.col,.9); ctx.lineWidth=Math.max(1.6,Math.min(7,rx2*0.09));\n            ctx.beginPath(); ctx.ellipse(cb.x,cb.y,rx2,ry2,0,0,Math.PI); ctx.stroke(); }\n          // highlight streak on the disc top\n          ctx.globalAlpha=al*0.7; ctx.fillStyle='#dfeaff';\n          ctx.beginPath(); ctx.ellipse(tt.x,tt.y-ry*0.25,rx*0.42,ry*0.16,0,0,7); ctx.fill();\n          ctx.globalAlpha=1;\n        }\n      }\n    } else if(p.type==='pylon'){\n      contactShadow(p.x,p.z,0.6,0.6,0.35);\n      box(p.x,0,p.z,0.34,0.30,0.34,fogc(C.slab,p.z),fogc(C.slabTop,p.z),fogc(C.boardDark,p.z));\n      const t=proj(p.x,0.3,p.z);\n      if(t&&al>0.08) neonLine(p.x,0.32,p.z,p.x,p.h,p.z,p.col,Math.max(2,Math.min(8,t.s*0.045)),true);\n    } else if(p.type==='arch'){\n      // decorative gate over the track — depth landmark\n      const w=RINK+0.25, hh=p.h;\n      slab(-w,0,p.z,0.3,hh,0.3,p.col,'side');\n      slab(w,0,p.z,0.3,hh,0.3,p.col,'side');\n      const t=proj(0,hh,p.z);\n      if(t){ box(0,hh-0.18,p.z,w*2+0.3,0.24,0.3,fogc(C.slab,p.z),fogc(C.slabTop,p.z),fogc(C.boardDark,p.z));\n        neonLine(-w,hh-0.2,p.z,w,hh-0.2,p.z,p.col,Math.max(1.4,t.s*0.02),true); }\n    }\n  }\n}\nfunction drawEnts(){\n  const list=G.ents.filter(e=>e.z>CAM.z+0.4 && e.z<G._z+95).sort((a,b)=>b.z-a.z);\n  for(const e of list){\n    const x=LANES[e.lane], al=fogA(e.z,1);\n    if(al<=0.02) continue;\n    switch(e.type){\n      /* FAMILY 1 — BLOCKER: tall slab, red edge. Never passable. */\n      case 'wall': {\n        contactShadow(x,e.z,1.4,1.05,0.7);\n        const w=1.06, d=0.78;\n        const stone='#4a5772', stoneTop='#69789a', stoneDark='#232c40';\n        box(x,0,e.z-0.07,w*1.16,0.13,d+0.14, fogc(stoneDark,e.z), fogc(stone,e.z), fogc(C.ink,e.z));\n        const bodyH=e.h-0.30;\n        for(let k=0;k<3;k++){\n          const y0=0.13+bodyH*(k/3), hh=bodyH/3, inset=k*0.015;\n          box(x,y0,e.z+inset,w-inset*2,hh*0.94,d-inset*2,\n            fogc(k===1?mix(stone,stoneDark,0.22):stone,e.z), fogc(stoneTop,e.z), fogc(stoneDark,e.z));\n        }\n        box(x,0.13+bodyH,e.z-0.06,w*1.14,0.17,d+0.12,\n          fogc(stoneTop,e.z), fogc(mix(stoneTop,'#ffffff',0.22),e.z), fogc(stone,e.z));\n        const t=proj(x,e.h,e.z);\n        if(t&&al>0.10){\n          neonLine(x-w*0.57,e.h,e.z-0.06,x+w*0.57,e.h,e.z-0.06,C.neonRed,Math.max(1.8,t.s*0.026),al>0.35);\n          neonLine(x-w*0.57,e.h,e.z-0.06,x-w*0.57,e.h,e.z+d+0.06,hexA(C.neonRed,.5),Math.max(1,t.s*0.012),false);\n          neonLine(x+w*0.57,e.h,e.z-0.06,x+w*0.57,e.h,e.z+d+0.06,hexA(C.neonRed,.5),Math.max(1,t.s*0.012),false);\n          const A=proj(x-w*0.30,0.13+bodyH*0.78,e.z), B=proj(x+w*0.30,0.13+bodyH*0.78,e.z),\n                Cc=proj(x+w*0.30,0.13+bodyH*0.22,e.z), D=proj(x-w*0.30,0.13+bodyH*0.22,e.z);\n          quad(A,B,Cc,D, fogc(stoneDark,e.z), null);\n          if(al>0.3){\n            for(let k=0;k<2;k++){ const yy=0.13+bodyH*(0.34+k*0.3);\n              neonLine(x-w*0.24,yy,e.z-0.005,x+w*0.24,yy,e.z-0.005,hexA(C.neonRed,.6),Math.max(1.2,t.s*0.013),false); }\n          }\n          ctx.globalAlpha=al*0.8; ctx.fillStyle=fogc('#8fa0c0',e.z);\n          for(const sd of [-1,1]){ const bp=proj(x+sd*w*0.44,e.h+0.005,e.z+d*0.5);\n            if(bp){ ctx.beginPath(); ctx.arc(bp.x,bp.y,Math.max(1,Math.min(5,bp.s*0.016)),0,7); ctx.fill(); } }\n          ctx.globalAlpha=1;\n        }\n        break; }\n      /* FAMILY 2 — HOP BAR: low bar, amber edge. Jump it. */\n      case 'stick': {\n        const w=e.rot?1.34:1.04;\n        contactShadow(x,e.z,w*1.15,0.6,0.5);\n        box(x,0,e.z,w,0.16,0.34, fogc('#7a4f10',e.z), fogc(C.amber,e.z), fogc('#4a2f08',e.z));\n        const t=proj(x,0.16,e.z);\n        if(t&&al>0.12){\n          neonLine(x-w/2,0.165,e.z,x+w/2,0.165,e.z,'#ffd479',Math.max(1.8,t.s*0.026),true);\n          neonLine(x-w/2,0.165,e.z,x-w/2,0.165,e.z+0.34,hexA(C.amber,.7),Math.max(1,t.s*0.012),false);\n          neonLine(x+w/2,0.165,e.z,x+w/2,0.165,e.z+0.34,hexA(C.amber,.7),Math.max(1,t.s*0.012),false);\n        }\n        break; }\n      /* FAMILY 3 — PIT: dark void with cyan rim. Jump it. */\n      case 'hole': {\n        flat(x,e.z,1.0,e.d,fogc(C.pit,e.z,0.5),null);\n        neonLine(x-0.5,0,e.z,x+0.5,0,e.z,C.neonCyan,Math.max(1,(proj(x,0,e.z)||{s:6}).s*0.014),al>0.4);\n        neonLine(x-0.5,0,e.z+e.d,x+0.5,0,e.z+e.d,'rgba(77,227,255,.5)',Math.max(1,(proj(x,0,e.z+e.d)||{s:6}).s*0.012),false);\n        break; }\n      /* FAMILY 4 — MIST CUBE: a chunky block of fog. Solid shape, soft fill. */\n      case 'drift': {\n        const w=1.0, hh=0.72, d=1.5;\n        const x1=x-w/2, x2=x+w/2, zf=e.z, zb=e.z+d;\n        const A=proj(x1,hh,zf), B=proj(x2,hh,zf), Cc=proj(x2,0,zf), D=proj(x1,0,zf);\n        const E=proj(x1,hh,zb), F=proj(x2,hh,zb), Gg=proj(x2,0,zb), Hh=proj(x1,0,zb);\n        if(!A||!B||!Cc||!D) break;\n        // chill footprint\n        flat(x,e.z,w*1.04,d,hexA(TH.light,0.06*al),null);\n        // volume: back face, top, then front — all translucent so it reads as vapour\n        quad(E,F,Gg,Hh, hexA(TH.light,0.07*al), null);\n        quad(E,F,B,A, hexA(TH.light,0.13*al), null);\n        if(x > CAM.x) quad(A,E,Hh,D, hexA(TH.light,0.10*al), null);\n        else quad(B,F,Gg,Cc, hexA(TH.light,0.10*al), null);\n        quad(A,B,Cc,D, hexA(TH.light,0.11*al), null);\n        // soft billows inside the cube so it isn't a flat pane of colour\n        ctx.save();\n        ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(Cc.x,Cc.y); ctx.lineTo(D.x,D.y); ctx.closePath();\n        ctx.clip();\n        for(let L=0;L<3;L++){\n          const t=proj(x+Math.sin(G.t*0.6+L*2.1+e.z)*0.16, hh*(0.28+L*0.24), zf+0.2);\n          if(!t) continue;\n          const rx=t.s*0.34, a0=0.13*al;\n          const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,rx);\n          g.addColorStop(0,hexA(TH.light,a0)); g.addColorStop(1,hexA(TH.light,0));\n          ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(t.x,t.y,rx,rx*0.7,0,0,7); ctx.fill();\n        }\n        ctx.restore();\n        // frosted edges give the cube its silhouette\n        if(al>0.18){\n          const lw=Math.max(1.2,(A.s||6)*0.014), col=hexA(TH.light,.55);\n          neonLine(x1,0,zf,x1,hh,zf,col,lw,false);\n          neonLine(x2,0,zf,x2,hh,zf,col,lw,false);\n          neonLine(x1,hh,zf,x2,hh,zf,hexA(TH.light,.7),lw*1.3,al>0.4);\n          neonLine(x1,0,zf,x2,0,zf,hexA(TH.light,.45),lw,false);\n          neonLine(x1,hh,zf,x1,hh,zb,hexA(TH.light,.3),lw*0.8,false);\n          neonLine(x2,hh,zf,x2,hh,zb,hexA(TH.light,.3),lw*0.8,false);\n        }\n        break; }\n      /* FAMILY 5 — RAMP: amber wedge with chevrons. Launches you. */\n      case 'ramp': {\n        contactShadow(x,e.z,1.2,1.6,0.45);\n        const A=proj(x-0.55,0,e.z), B=proj(x+0.55,0,e.z), Cc=proj(x+0.55,e.h,e.z+1.5), D=proj(x-0.55,e.h,e.z+1.5);\n        quad(A,B,Cc,D, fogc(C.slabTop,e.z), fogc(C.ink,e.z), 1.6);\n        const E=proj(x-0.55,0,e.z+1.5), F=proj(x+0.55,0,e.z+1.5);\n        quad(D,Cc,F,E, fogc(C.slab,e.z), fogc(C.ink,e.z), 1.4);\n        for(let i=0;i<3;i++){\n          const zz=e.z+0.28+i*0.42, yy=e.h*((i+0.6)/3.2);\n          neonLine(x-0.34,yy,zz,x,yy+0.07,zz,C.neonCyan,Math.max(1.4,(A?A.s:6)*0.022),i>=1);\n          neonLine(x,yy+0.07,zz,x+0.34,yy,zz,C.neonCyan,Math.max(1.4,(A?A.s:6)*0.022),i>=1);\n        }\n        neonLine(x-0.55,e.h,e.z+1.5,x+0.55,e.h,e.z+1.5,C.neonCyan,Math.max(1.8,(A?A.s:6)*0.024),true);\n        neonLine(x-0.55,0,e.z,x-0.55,e.h,e.z+1.5,hexA(C.neonCyan,.5),Math.max(1,(A?A.s:6)*0.01),false);\n        neonLine(x+0.55,0,e.z,x+0.55,e.h,e.z+1.5,hexA(C.neonCyan,.5),Math.max(1,(A?A.s:6)*0.01),false);\n        break; }\n      /* FORK — two lit branch gates, centre walled off */\n      case 'fork': {\n        const opts=[{lane:0,key:e.left},{lane:2,key:e.right}];\n        for(const o of opts){\n          const ox=LANES[o.lane], col=THEMES[o.key].ledA, hh=1.75;\n          slab(ox-0.62,0,e.z,0.16,hh,0.3,col,'side');\n          slab(ox+0.62,0,e.z,0.16,hh,0.3,col,'side');\n          const t=proj(ox,hh,e.z);\n          if(t){\n            box(ox,hh-0.16,e.z,1.4,0.2,0.3,fogc(TH.boardFace,e.z),fogc(TH.boardTop,e.z),fogc(C.ink,e.z));\n            neonLine(ox-0.7,hh-0.18,e.z,ox+0.7,hh-0.18,e.z,col,Math.max(1.4,t.s*0.018),true);\n            // branch glow across the mouth\n            const A=proj(ox-0.62,hh-0.2,e.z), B=proj(ox+0.62,hh-0.2,e.z), Cc=proj(ox+0.62,0,e.z), D=proj(ox-0.62,0,e.z);\n            quad(A,B,Cc,D, hexA(col,0.10*al), null);\n          }\n          // arrows on the ice pointing into the branch\n          for(let i=0;i<3;i++){\n            const zz=e.z-2.4+i*0.9, dir=o.lane===0?-1:1;\n            neonLine(ox-dir*0.28,0.01,zz,ox+dir*0.10,0.01,zz+0.34,col,Math.max(1.2,(proj(ox,0,zz)||{s:6}).s*0.012),i===2);\n            neonLine(ox+dir*0.10,0.01,zz+0.34,ox-dir*0.28,0.01,zz+0.68,col,Math.max(1.2,(proj(ox,0,zz)||{s:6}).s*0.012),i===2);\n          }\n        }\n        break; }\n      /* AIR RING — fly through it off a ramp for a token payout */\n      case 'ring': {\n        if(e.pop>0) e.pop=Math.max(0,e.pop-0.03);\n        const t=proj(x,e.y,e.z); if(!t) break;\n        const bob=Math.sin(G.t*1.8+e.z)*0.03;\n        const tc=proj(x,e.y+bob,e.z); if(!tc) break;\n        const rx=Math.max(3,tc.s*e.rad), ry=rx*0.94;\n        const done=e.got, dead=e.missed;\n        const col = done ? C.amber : (dead ? '#5a6478' : C.neonCyan);\n        // outer bloom\n        if(!dead){\n          ctx.globalAlpha=al*(done?0.5*e.pop:0.28);\n          const gg=ctx.createRadialGradient(tc.x,tc.y,rx*0.55,tc.x,tc.y,rx*1.5);\n          gg.addColorStop(0,hexA(col,0)); gg.addColorStop(0.6,hexA(col,0.5)); gg.addColorStop(1,hexA(col,0));\n          ctx.fillStyle=gg; ctx.beginPath(); ctx.ellipse(tc.x,tc.y,rx*1.5,ry*1.5,0,0,7); ctx.fill();\n          ctx.globalAlpha=1;\n        }\n        // chunky torus: dark body with a bright inner and outer edge\n        const lw=Math.max(2,rx*0.20);\n        ctx.globalAlpha=al*(dead?0.35:1);\n        ctx.strokeStyle=fogc('#161d2e',e.z); ctx.lineWidth=lw*1.5;\n        ctx.beginPath(); ctx.ellipse(tc.x,tc.y,rx,ry,0,0,7); ctx.stroke();\n        ctx.strokeStyle=col; ctx.lineWidth=lw*0.62;\n        ctx.beginPath(); ctx.ellipse(tc.x,tc.y,rx*1.06,ry*1.06,0,0,7); ctx.stroke();\n        ctx.beginPath(); ctx.ellipse(tc.x,tc.y,rx*0.9,ry*0.9,0,0,7); ctx.stroke();\n        // success burst\n        if(done&&e.pop>0){\n          ctx.globalAlpha=e.pop*0.85; ctx.strokeStyle='#fff2cc'; ctx.lineWidth=lw*(0.4+e.pop*0.8);\n          const k=1+(1-e.pop)*0.9;\n          ctx.beginPath(); ctx.ellipse(tc.x,tc.y,rx*k,ry*k,0,0,7); ctx.stroke();\n        }\n        ctx.globalAlpha=1;\n        // faint tether to the ice so the height reads\n        if(!dead && al>0.25){\n          const g0=proj(x,0.02,e.z);\n          if(g0){ ctx.globalAlpha=al*0.16; ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,rx*0.06);\n            ctx.beginPath(); ctx.moveTo(tc.x,tc.y+ry); ctx.lineTo(g0.x,g0.y); ctx.stroke();\n            ctx.globalAlpha=al*0.2;\n            ctx.beginPath(); ctx.ellipse(g0.x,g0.y,rx*0.5,rx*0.16,0,0,7); ctx.stroke();\n            ctx.globalAlpha=1; }\n        }\n        break; }\n      /* PICKUPS — amber chip / cyan chevrons / cyan ring */\n      case 'coin': if(!e.got){\n        const t=proj(x,e.y+Math.sin(G.t*3+e.z)*0.05,e.z); if(!t) break;\n        const rr=Math.max(3,Math.min(26,t.s*0.17));\n        const spin=G.t*2.0+e.z*0.9;\n        const sq=Math.max(0.14,Math.abs(Math.cos(spin)));\n        const thick=rr*0.34, dir=Math.cos(spin)>=0?1:-1;\n        ctx.globalAlpha=al*0.3; ctx.fillStyle=C.amber;\n        ctx.beginPath(); ctx.arc(t.x,t.y,rr*1.9,0,7); ctx.fill();\n        const tgc=proj(x,0,e.z);\n        if(tgc){ ctx.globalAlpha=al*0.2;\n          ctx.beginPath(); ctx.ellipse(tgc.x,tgc.y,rr*0.9,rr*0.3,0,0,7); ctx.fill(); }\n        ctx.globalAlpha=al;\n        const oct=(cx,cy,ww,hh)=>{ ctx.beginPath();\n          for(let k=0;k<8;k++){ const a=k*Math.PI/4+Math.PI/8;\n            const px=cx+Math.cos(a)*ww, py=cy+Math.sin(a)*hh;\n            k?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.closePath(); };\n        const ox=-dir*thick*sq*0.9 + dir*thick*(1-sq)*1.1;\n        oct(t.x+ox, t.y, Math.max(1,rr*sq), rr);\n        ctx.fillStyle='#a05e00'; ctx.fill();\n        ctx.beginPath();\n        ctx.moveTo(t.x+ox, t.y-rr); ctx.lineTo(t.x, t.y-rr);\n        ctx.lineTo(t.x, t.y+rr); ctx.lineTo(t.x+ox, t.y+rr); ctx.closePath();\n        ctx.fillStyle='#c07400'; ctx.fill();\n        oct(t.x, t.y, Math.max(1,rr*sq), rr);\n        const fg=ctx.createLinearGradient(t.x,t.y-rr,t.x,t.y+rr);\n        fg.addColorStop(0,'#ffe08a'); fg.addColorStop(0.5,C.amber); fg.addColorStop(1,'#d98a00');\n        ctx.fillStyle=fg; ctx.fill();\n        ctx.strokeStyle='#7a4600'; ctx.lineWidth=Math.max(1,rr*0.13); ctx.stroke();\n        if(rr>5){\n          oct(t.x, t.y, Math.max(1,rr*sq*0.58), rr*0.58);\n          ctx.strokeStyle=hexA('#fff0c0',.7); ctx.lineWidth=Math.max(1,rr*0.09); ctx.stroke();\n          ctx.globalAlpha=al*0.85; ctx.fillStyle='#fff8e0';\n          ctx.beginPath(); ctx.ellipse(t.x-rr*sq*0.3, t.y-rr*0.42, Math.max(0.8,rr*sq*0.2), rr*0.14,0,0,7); ctx.fill();\n        }\n        ctx.globalAlpha=1;\n        break; }\n      case 'boost': if(!e.got){\n        const t=proj(x,e.y,e.z); if(!t) break;\n        const s=t.s*0.2;\n        for(let i=0;i<2;i++){\n          const yy=e.y - i*0.16;\n          neonLine(x-0.28,yy,e.z,x,yy+0.16,e.z,C.neonCyan,Math.max(1.4,s*0.28),true);\n          neonLine(x,yy+0.16,e.z,x+0.28,yy,e.z,C.neonCyan,Math.max(1.4,s*0.28),true);\n        }\n        break; }\n      case 'shieldup': if(!e.got){\n        const t=proj(x,e.y+Math.sin(G.t*3)*0.05,e.z); if(!t) break;\n        const rr=Math.max(3,Math.min(26,t.s*0.2));\n        ctx.globalAlpha=al*0.3; ctx.fillStyle=C.neonCyan;\n        ctx.beginPath(); ctx.arc(t.x,t.y,rr*1.5,0,7); ctx.fill();\n        ctx.globalAlpha=al; ctx.strokeStyle=C.neonCyan; ctx.lineWidth=Math.max(2,rr*0.18);\n        ctx.beginPath(); ctx.arc(t.x,t.y,rr,0,7); ctx.stroke(); ctx.globalAlpha=1;\n        break; }\n    }\n  }\n}\nfunction drawPuck(){\n  const z=G._z, x=G.px, y=G.py;\n  const RAD=0.32, TH=0.155;                      // chunky arcade puck, still flat on the ice\n  const tb=proj(x,y,z), tt=proj(x,y+TH,z), tg=proj(x,0,z);\n  if(!tb||!tt) return;\n  const boosting=G.boostT>0;\n  if(boosting){\n    for(let i=1;i<=7;i++){\n      const zz=z-i*0.55; const a=proj(x-0.24,0.012,zz), b=proj(x+0.24,0.012,zz),\n        c=proj(x+0.30,0.012,zz-0.5), d=proj(x-0.30,0.012,zz-0.5);\n      if(a&&b&&c&&d) quad(a,b,c,d,'rgba(77,227,255,'+(0.20*(1-i/8))+')',null);\n    }\n  }\n  const sq=G.squash||0;\n  const rx=RAD*tb.s*(1+sq*0.13);\n  // foreshortening comes from the real camera angle, so the disc reads flat on the ice\n  const elev=Math.atan2(Math.max(0.03, CAM.y-(y+TH*0.5)), Math.max(0.4, z-CAM.z));\n  const ry=Math.max(1.2, rx*Math.max(0.19, Math.sin(elev)) * (1 + (G.pitch||0)*0.55));\n  const sideH=Math.max(1.5, (tb.y-tt.y)*(1-sq*0.42));\n  // contact shadow sized to the puck's own footprint, so it never looks detached\n  if(tg){\n    const lift=Math.min(1, y*1.8);\n    const srx=rx*(1.06-lift*0.24), sry=Math.max(2, ry*(1.15-lift*0.2));\n    const g=ctx.createRadialGradient(tg.x,tg.y,0,tg.x,tg.y,srx);\n    g.addColorStop(0,'rgba(2,6,14,'+(0.72-lift*0.42)+')');\n    g.addColorStop(0.62,'rgba(2,6,14,'+(0.42-lift*0.26)+')');\n    g.addColorStop(1,'rgba(2,6,14,0)');\n    ctx.save(); ctx.translate(tg.x,tg.y); ctx.scale(1,sry/srx); ctx.fillStyle=g;\n    ctx.beginPath(); ctx.arc(0,0,srx*1.35,0,7); ctx.fill(); ctx.restore();\n  }\n  ctx.save();\n  ctx.translate(tb.x,tb.y); ctx.rotate(G.tilt*0.16 - (G.pitch||0)*0.06);\n  if(boosting){\n    const bg=ctx.createRadialGradient(0,-sideH*0.5,0,0,-sideH*0.5,rx*2.4);\n    bg.addColorStop(0,'rgba(77,227,255,.40)'); bg.addColorStop(1,'rgba(77,227,255,0)');\n    ctx.save(); ctx.scale(1,0.55); ctx.fillStyle=bg;\n    ctx.beginPath(); ctx.arc(0,-sideH*0.5/0.55,rx*2.4,0,7); ctx.fill(); ctx.restore();\n  }\n  const sg=ctx.createLinearGradient(0,-sideH-ry,0,ry);\n  sg.addColorStop(0,'#232c40'); sg.addColorStop(0.55,'#141a28'); sg.addColorStop(1,'#080b14');\n  ctx.fillStyle=sg;\n  ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI); ctx.closePath(); ctx.fill();   // bottom front lip\n  ctx.beginPath(); ctx.rect(-rx,-sideH,rx*2,sideH); ctx.fill();                        // barrel wall\n  ctx.beginPath(); ctx.ellipse(0,-sideH,rx,ry,0,0,Math.PI*2); ctx.closePath(); ctx.fill();\n  ctx.strokeStyle='#02050c'; ctx.lineWidth=Math.max(1.2,rx*0.045); ctx.lineJoin='round';\n  ctx.beginPath(); ctx.moveTo(-rx,-sideH); ctx.lineTo(-rx,0);\n  ctx.ellipse(0,0,rx,ry,0,Math.PI,0,true); ctx.lineTo(rx,-sideH); ctx.stroke();       // silhouette\n  // rim light along the top edge\n  ctx.strokeStyle=boosting?'#9df5ff':'rgba(93,231,255,.92)';\n  ctx.lineWidth=Math.max(1.8,rx*0.07);\n  ctx.beginPath(); ctx.ellipse(0,-sideH,rx*0.995,ry*0.99,0,0.1,Math.PI-0.1); ctx.stroke();\n  // top face\n  const tf=ctx.createLinearGradient(0,-sideH-ry,0,-sideH+ry);\n  tf.addColorStop(0,'#2a3448'); tf.addColorStop(1,'#111725');\n  ctx.fillStyle=tf; ctx.strokeStyle='#02050c'; ctx.lineWidth=Math.max(1.1,rx*0.04);\n  ctx.beginPath(); ctx.ellipse(0,-sideH,rx,ry,0,0,7); ctx.fill(); ctx.stroke();\n  // spin marks, flattened with the face\n  ctx.strokeStyle='rgba(170,220,255,.26)'; ctx.lineWidth=Math.max(1,rx*0.05);\n  for(let i=0;i<3;i++){ const a=G.spin+i*2.09;\n    ctx.beginPath(); ctx.ellipse(0,-sideH,rx*0.6,ry*0.6,0,a,a+0.8); ctx.stroke(); }\n  if(G.shield){\n    ctx.strokeStyle='rgba(77,227,255,.72)'; ctx.lineWidth=Math.max(1.6,rx*0.08);\n    ctx.beginPath(); ctx.ellipse(0,-sideH*0.6,rx*1.45,Math.max(ry*1.6,rx*0.5),0,0,7); ctx.stroke();\n  }\n  ctx.restore();\n  if(G.mode==='dead' && G.crashT<0.6){\n    const k=G.crashT/0.6, rr=rx+tb.s*1.4*k;\n    ctx.globalAlpha=(1-k)*0.7; ctx.strokeStyle='#ff6b8a'; ctx.lineWidth=Math.max(2,tb.s*0.045*(1-k));\n    ctx.beginPath(); ctx.ellipse(tb.x,tb.y,rr,rr*0.26,0,0,7); ctx.stroke(); ctx.globalAlpha=1;\n  }\n}\nfunction drawParts(){\n  for(const p of G.parts){\n    if(p.z < CAM.z+1.7) continue;\n    const t=proj(p.x,p.y,p.z); if(!t) continue;\n    ctx.globalAlpha=Math.max(0,p.life)*fogA(p.z,1)*0.7;\n    ctx.fillStyle=p.col;\n    ctx.beginPath(); ctx.arc(t.x,t.y,Math.max(1,Math.min(3,t.s*p.r)),0,7); ctx.fill();\n  }\n  ctx.globalAlpha=1;\n}\nfunction drawVignette(){\n  const vg=ctx.createRadialGradient(W/2,H*0.56,Math.min(W,H)*0.26,W/2,H*0.56,Math.max(W,H)*0.82);\n  vg.addColorStop(0,hexA(TH.bgTop,0)); vg.addColorStop(1,hexA(TH.bgTop,.55));\n  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);\n}\nfunction drawSpeedFx(){\n  const v=Math.max(0,(G.speed-14)/24)+(G.boostT>0?0.5:0);\n  if(v>0.12){\n    // streaks radiating from the vanishing point\n    const vp=proj(0,0.5,CAM.z+60), cx=vp?vp.x:W/2, cy=H*HORIZON_F+H*0.02;\n    ctx.save(); ctx.globalAlpha=Math.min(.18,v*.16); ctx.strokeStyle='#dff1ff'; ctx.lineCap='round';\n    for(let i=0;i<10;i++){\n      const a=(i/10)*Math.PI*2+G.t*0.5, r1=Math.min(W,H)*(0.46+((i*7)%5)*0.04), r2=r1+Math.min(W,H)*(0.05+v*0.12);\n      ctx.lineWidth=1.2+v*1.1;\n      ctx.beginPath();\n      ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1*0.62);\n      ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2*0.62);\n      ctx.stroke();\n    }\n    ctx.restore();\n  }\n  if(G.boostT>0){\n    const g=ctx.createRadialGradient(W/2,H*0.74,0,W/2,H*0.74,Math.max(W,H)*0.72);\n    g.addColorStop(0,'rgba(77,227,255,0)'); g.addColorStop(1,'rgba(77,227,255,.12)');\n    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);\n  }\n}\n/* ============================================================\n   LOGIC\n   ============================================================ */\nG.px = 0; G.py = 0; G._z = 0;\nG.px_z = function(){ return this._z; };\n\nfunction resetRun(launchSpeed){\n  G.ents=[]; G.parts=[]; G.props=[]; G.motes=[]; G.bends=[];\n  G._z=0; G.dist=0; G.lane=1; G.px=0; G.py=0; G.vy=0; G.air=false;\n  G.coins=0; G.ringStreak=0; G.shield=false; G.slow=0; G.boostT=0; G.gauge=1; G.ready=true;\n  G.spin=0; G.tilt=0; G.squash=0; G.pitch=0; G.crashT=0; G.onRamp=null; G.grav=9.6; G.topSpeed=launchSpeed;\n  G.spawnZ=16; G.propZ=6; G.bends=[]; G.motes=[]; G.zone='ice'; G.nextForkZ=170; G.speed=launchSpeed; G.targetSpeed=launchSpeed;\n  CAM.x=0; CAM.z=-2.0; CAM.shake=0;\n  spawnAhead(); spawnProps();\n}\nfunction baseSpeed(){\n  return Math.min(28, 10.5 + G.dist/80) * ZP().speed;\n}\nfunction setLane(n){\n  const nl = Math.max(0,Math.min(2,n));\n  if (nl===G.lane) return;\n  G.lane=nl; G.tilt = (nl - G.lane)*0; sfx.swipe();\n  for(let i=0;i<6;i++) G.parts.push({x:G.px,y:0.05,z:G._z+.2,vx:(Math.random()-.5)*2,vy:Math.random()*1.2,vz:-2,\n    r:0.03,life:1,col:'#bfe4ff'});\n}\nfunction hop(){\n  if (G.air || G.onRamp) return;\n  G.air=true; G.vy=3.15; sfx.hop();\n}\nfunction useBoost(){\n  if (!G.ready || G.mode!=='play') return;\n  G.ready=false; G.gauge=0; G.boostT=2.2; G.shieldFlash=1; sfx.boost();\n  flashScreen(.25);\n  for(let i=0;i<26;i++) G.parts.push({x:G.px+(Math.random()-.5)*.6,y:Math.random()*.5,z:G._z-.4,\n    vx:(Math.random()-.5)*2,vy:Math.random()*2,vz:-8,r:0.04,life:1,col:C.mint});\n}\nfunction flashScreen(a){\n  const el=document.getElementById('flash');\n  el.style.transition='none'; el.style.opacity=a;\n  requestAnimationFrame(()=>{ el.style.transition='opacity .35s ease'; el.style.opacity=0; });\n}\nfunction crash(){\n  if (G.mode!=='play') return;\n  G.mode='dead'; G.crashT=0; CAM.shake=1; sfx.crash(); flashScreen(.5);\n  for(let i=0;i<34;i++) G.parts.push({x:G.px,y:0.15,z:G._z,vx:(Math.random()-.5)*6,vy:Math.random()*4,vz:(Math.random()-.3)*4,\n    r:0.045,life:1,col:i%3?'#cfeaff':C.neonRed});\n  setTimeout(showGameOver, 850);\n}\n\nfunction step(dt){\n  G.t += dt;\n  lerpTheme(dt);\n  if (G.mode!=='home'){\n    const spec=TH.mote;\n    if (Math.random() < dt*spec.rate)\n      G.motes.push({x:(Math.random()-.5)*5.4, y:0.15+Math.random()*2.7, z:G._z+18+Math.random()*46,\n        vx:(Math.random()-.5)*0.25, vy:spec.rise*(0.6+Math.random()*0.8),\n        r:spec.size*(0.6+Math.random()*0.9), col:spec.col, life:1});\n    for(const m of G.motes){ m.x+=m.vx*dt; m.y+=m.vy*dt; if(m.y<0.05){m.y=0.05;m.vy=Math.abs(m.vy)*0.4;} }\n    G.motes = G.motes.filter(m=>m.z>CAM.z+0.6 && m.y<4);\n    if (G.motes.length>150) G.motes.splice(0, G.motes.length-150);\n  }\n  if (G.squash>0) G.squash = Math.max(0, G.squash - dt*4.5);\n  const wantPitch = G.onRamp ? 1 : (G.air ? Math.max(0, Math.min(1, G.vy*0.22)) : 0);\n  G.pitch = (G.pitch||0) + (wantPitch - (G.pitch||0)) * Math.min(1, dt*7);\n  if (G.mode==='play'){\n    // speed\n    G.targetSpeed = baseSpeed() * (G.boostT>0?1.55:1) * (G.slow>0?0.5:1);\n    G.speed += (G.targetSpeed - G.speed) * Math.min(1, dt*4);\n    G.topSpeed = Math.max(G.topSpeed, G.speed);\n    if (G.boostT>0) G.boostT -= dt;\n    if (G.slow>0) G.slow -= dt;\n    // gauge recharge\n    if (!G.ready){ G.gauge = Math.min(1, G.gauge + (dt/9)*ZP().gauge); if (G.gauge>=1){ G.ready=true; sfx.shield(); } }\n    G._z += G.speed*dt; G.dist += G.speed*dt;\n    G.spin += G.speed*dt*0.9;\n    // lateral\n    const tx = LANES[G.lane];\n    const dx = tx - G.px;\n    G.px += dx * Math.min(1, dt*ZP().steer);\n    G.tilt += ((dx*2.1) - G.tilt) * Math.min(1, dt*9);\n    // vertical\n    if (G.onRamp){\n      const e=G.onRamp, prog=(G._z - e.z)/1.5;\n      if (prog >= 1){\n        // off the lip — real launch, with hang time\n        G.onRamp=null; G.air=true; G.grav=7.9;\n        G.py=e.h; G.vy=3.1 + G.speed*0.036;\n        sfx.hop();\n        for(let i=0;i<14;i++) G.parts.push({x:G.px+(Math.random()-.5)*.5,y:e.h,z:G._z,\n          vx:(Math.random()-.5)*2.2,vy:Math.random()*1.8,vz:-2.5,r:0.03,life:.9,col:'#ffd9a3'});\n        CAM.shake=0.22;\n      } else {\n        G.py = e.h * Math.max(0, prog) * (0.55 + 0.45*Math.max(0,prog)); // eases up the wedge\n        G.vy = 0;\n      }\n    } else if (G.air){\n      G.vy -= G.grav*dt; G.py += G.vy*dt;\n      if (G.py<=0){ const vin=Math.abs(G.vy); G.py=0; G.vy=0; G.air=false; G.grav=9.6; G.squash=Math.min(1.5,0.6+vin*0.11); sfx.land();\n        for(let i=0;i<9;i++) G.parts.push({x:G.px+(Math.random()-.5)*.4,y:0.03,z:G._z,vx:(Math.random()-.5)*2.4,\n          vy:Math.random()*1.4,vz:-1,r:0.032,life:1,col:'#bfe4ff'}); }\n    }\n    // ice spray\n    if (Math.random() < dt*30)\n      G.parts.push({x:G.px+(Math.random()-.5)*.35,y:0.02,z:G._z-0.15,vx:(Math.random()-.5)*1.2,vy:Math.random()*.7,\n        vz:-3,r:0.022,life:.8,col:'rgba(200,232,255,.85)'});\n    collide();\n    spawnAhead(); spawnProps();\n    G.ents = G.ents.filter(e=>e.z > CAM.z-3);\n    G.props = G.props.filter(p=>p.z > CAM.z-6);\n    document.getElementById('hudDist').innerHTML = Math.floor(G.dist)+'<span>METRES<\u002Fspan>';\n    document.getElementById('hudCoins').textContent = G.coins;\n    document.getElementById('hudShield').style.display = G.shield?'flex':'none';\n    const zn=document.getElementById('hudZoneName');\n    if(zn && zn.textContent!==TH.name){ zn.textContent=TH.name;\n      document.getElementById('hudZoneDot').style.background=TH.ledA;\n      document.getElementById('hudZoneDot').style.boxShadow='0 0 10px '+TH.ledA; }\n    paintBoost();\n  } else if (G.mode==='home'){\n    G.speed += (3.4 - G.speed) * Math.min(1, dt*2);\n    G._z += G.speed*dt; G.spin += G.speed*dt*0.9;\n    spawnAhead(); spawnProps();\n    G.ents = G.ents.filter(e=>e.z > CAM.z-3); G.props = G.props.filter(pr=>pr.z > CAM.z-6);\n  } else if (G.mode==='dead'){\n    G.crashT += dt;\n    G.speed *= Math.pow(0.02, dt);\n    G._z += G.speed*dt;\n  }\n  // camera\n  const camLag = G.mode==='dead'?4:7;\n  CAM.z += ((G._z - 1.95 - (G.boostT>0?0.25:0)) - CAM.z) * Math.min(1, dt*camLag);\n  CAM.x += ((G.px*0.55) - CAM.x) * Math.min(1, dt*6);\n  CAM.y = 0.36 + G.py*0.42 + (G.boostT>0?0.02:0);\n  if (CAM.shake>0) CAM.shake -= dt*1.6;\n  // particles\n  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=(p.vz||0)*dt; p.vy-=6*dt; p.life-=dt*1.3; if(p.y<0){p.y=0;p.vy*=-0.3;} }\n  G.parts = G.parts.filter(p=>p.life>0);\n}\nfunction collide(){\n  const z=G._z, lane=G.lane, y=G.py;\n  for (const e of G.ents){\n    if (e.z < z-1.8 || e.z > z+1.4) continue;\n    if (e.type==='fork'){ if(!e.done && z > e.z-0.4) takeFork(e); continue; }\n    if (e.lane !== lane) continue;\n    const near = Math.abs(e.z - z);\n    if (e.type==='coin'){ if(!e.got && near<0.75 && Math.abs(y-e.y)<0.6){ e.got=true; G.coins++; sfx.coin();\n        G.parts.push({x:LANES[e.lane],y:e.y,z:e.z,vx:0,vy:2,vz:0,r:0.05,life:.6,col:C.yellow}); } continue; }\n    if (e.type==='boost'){ if(!e.got && near<0.9){ e.got=true; G.gauge=1; G.ready=true; useBoost(); } continue; }\n    if (e.type==='shieldup'){ if(!e.got && near<0.9){ e.got=true; G.shield=true; sfx.shield(); } continue; }\n    if (e.type==='ring'){\n      if(!e.got && !e.missed && near<0.7){\n        if (y > e.y - e.rad*0.95 && y < e.y + e.rad*1.15){\n          e.got=true; e.pop=1;\n          G.coins += e.reward;\n          G.ringStreak = (G.ringStreak||0)+1;\n          sfx.coin(); setTimeout(()=>sfx.shield(),70);\n          toast('+'+e.reward+' TOKENS', G.ringStreak>1 ? (G.ringStreak+' RINGS IN A ROW') : 'CLEAN THROUGH');\n          flashScreen(.14);\n          for(let i=0;i<20;i++) G.parts.push({x:G.px+(Math.random()-.5)*.7, y:e.y+(Math.random()-.5)*.7, z:e.z,\n            vx:(Math.random()-.5)*3, vy:(Math.random()-.4)*2.4, vz:-2, r:0.045, life:1, col:C.amber});\n        } else if (e.z < z-0.4){ e.missed=true; G.ringStreak=0; }\n      }\n      continue;\n    }\n    if (e.hit) continue;\n    if (e.type==='ramp'){ if(!G.air && !G.onRamp && z>e.z-0.85 && z<e.z+1.25){ e.hit=true; G.onRamp=e; sfx.swipe(); } continue; }\n    if (e.type==='drift'){ if(near<1.0 && y<0.5){ e.hit=true;\n      for(let i=0;i<10;i++) G.parts.push({x:G.px+(Math.random()-.5)*.7,y:0.05+Math.random()*0.4,z:G._z+0.3,\n        vx:(Math.random()-.5)*1.6,vy:Math.random()*0.7,vz:-2.2,r:0.05,life:.9,col:'rgba(210,235,255,.7)'});\n      if(G.boostT<=0){ G.slow=0.75; sfx.drift(); flashScreen(.08); } } continue; }\n    if (e.type==='hole'){ if(near<0.9 && y<0.25){ e.hit=true; survive(); } continue; }\n    if (e.type==='stick'){ if(near<0.78 && y<0.19){ e.hit=true; survive(); } continue; }\n    if (e.type==='wall'){ if(near<0.85 && y < e.h-0.22){ e.hit=true; survive(); } continue; }\n  }\n}\nfunction takeFork(e){\n  e.done=true;\n  const right = G.lane >= 2;\n  const zone = right ? e.right : e.left;\n  G.zone = zone;\n  G.bends.push({z0:G._z+6, dir: right?1:-1, amp: 5.0 + Math.random()*2, len: 74});\n  if (G.bends.length>4) G.bends.shift();\n  toast(THEMES[zone].name, THEMES[zone].tag);\n  flashScreen(.22);\n  tone(300,.5,'triangle',.09,2.2); noise(.4,.12);\n  CAM.shake=0.35;\n  for(let i=0;i<26;i++) G.motes.push({x:G.px+(Math.random()-.5)*3, y:Math.random()*2.4, z:G._z+2+Math.random()*22,\n    vx:(Math.random()-.5)*0.3, vy:THEMES[zone].mote.rise, r:THEMES[zone].mote.size*1.3, col:THEMES[zone].mote.col, life:1});\n}\nfunction survive(){\n  if (G.boostT>0 || G.shield){\n    G.shield=false; sfx.shield(); flashScreen(.2); CAM.shake=.6;\n    for(let i=0;i<18;i++) G.parts.push({x:G.px,y:0.2,z:G._z,vx:(Math.random()-.5)*4,vy:Math.random()*3,vz:-2,\n      r:0.04,life:.9,col:C.mint});\n    return;\n  }\n  crash();\n}\n\n/* ---------- boost dial ---------- */\nconst bArc = document.getElementById('boostArc'), bCtx = bArc.getContext('2d');\nfunction paintBoost(){\n  const s=76; bCtx.setTransform(DPR,0,0,DPR,0,0); bCtx.clearRect(0,0,s,s);\n  const r=s/2-6;\n  bCtx.lineWidth=3.5; bCtx.lineCap='round';\n  bCtx.strokeStyle='rgba(140,190,240,.14)';\n  bCtx.beginPath(); bCtx.arc(s/2,s/2,r,-Math.PI/2,Math.PI*1.5); bCtx.stroke();\n  bCtx.strokeStyle = G.ready?'#8df3ff':C.neonCyan;\n  bCtx.beginPath(); bCtx.arc(s/2,s/2,r,-Math.PI/2,-Math.PI/2 + Math.PI*2*G.gauge); bCtx.stroke();\n  document.getElementById('boostBtn').classList.toggle('ready', G.ready);\n  const m=document.getElementById('boostMeter');\n  if(m){ m.classList.toggle('ready',G.ready);\n    const segs=m.querySelectorAll('.segs b'), lit=Math.round(G.gauge*segs.length);\n    for(let i=0;i<segs.length;i++) segs[i].classList.toggle('on', i<lit); }\n}\n\n/* ============================================================\n   RENDER LOOP\n   ============================================================ */\nlet last=performance.now();\nfunction frame(now){\n  const dt = Math.max(0, Math.min(0.033, (now-last)/1000)); last=now;\n  f = Math.max(W,H*1.1) * 0.62;\n  if (G.mode==='charging') chargeTick(dt);\n  step(dt);\n  ctx.save();\n  if (CAM.shake>0){ const m=CAM.shake*14; ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m); }\n  drawSky(); drawIce(); drawGoal(); drawProps(); drawTunnel(); drawBoards(); drawEnts(); drawMotes(); drawParts(); drawPuck(); drawVignette(); drawSpeedFx();\n  ctx.restore();\n  lastFrameAt = now;\n}\nlet lastFrameAt = 0;\nfunction rafLoop(now){ frame(now); requestAnimationFrame(rafLoop); }\n// watchdog: some embedded/background contexts starve requestAnimationFrame\nsetInterval(()=>{ const n=performance.now(); if (n - lastFrameAt > 220) frame(n); }, 32);\n\n/* ============================================================\n   FLING / CHARGE\n   ============================================================ */\nconst chargeFill=document.getElementById('chargeFill'), chargeLabel=document.getElementById('chargeLabel');\nconst flingBtn=document.getElementById('flingBtn');\nlet charging=false, chargeTone=0;\nfunction chargeTick(dt){\n  G.power += G.dir * dt * 0.85;\n  if (G.power>1){ G.power=1; G.dir=-1; }\n  if (G.power<0){ G.power=0; G.dir=1; }\n  chargeFill.style.right = (100 - G.power*100)+'%';\n  chargeTone -= dt; if (chargeTone<=0){ chargeTone=0.07; if(sound) tone(260+G.power*520,.05,'square',.025); }\n}\nfunction startCharge(){\n  if (G.mode==='play'||G.mode==='dead') return;\n  ac(); G.mode='charging'; G.power=0; G.dir=1; charging=true;\n  flingBtn.classList.add('pressed');\n  chargeLabel.textContent='Release in the white zone!';\n}\nfunction releaseCharge(){\n  if (G.mode!=='charging') return;\n  charging=false; flingBtn.classList.remove('pressed');\n  const p=G.power;\n  const perfect = p>=0.72 && p<=0.88;\n  const launch = 11 + p*9 + (perfect?4:0);\n  G.launchGrade = perfect ? 'PERFECT FLING!' : (p>0.5 ? 'Good fling' : 'Weak fling');\n  sfx.fling();\n  document.getElementById('home').classList.remove('on');\n  document.getElementById('hud').classList.add('on');\n  G.mode='play'; resetRun(launch);\n  flashScreen(perfect?.4:.18);\n  toast(G.launchGrade);\n}\nfunction toast(msg,sub){\n  const el=document.createElement('div');\n  el.textContent=msg;\n  el.style.cssText='position:fixed;left:0;right:0;top:32%;text-align:center;z-index:30;pointer-events:none;'+\n   'font-family:inherit;font-weight:800;font-size:clamp(26px,8vw,44px);color:#fff;text-shadow:0 4px 0 rgba(19,26,44,.5);'+\n   'transition:opacity .5s ease,transform .5s ease';\n  if(sub){ const s=document.createElement('div');\n    s.textContent=sub;\n    s.style.cssText='font-size:.34em;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:6px;font-weight:700';\n    el.appendChild(s); }\n  document.body.appendChild(el);\n  requestAnimationFrame(()=>{ el.style.opacity='0'; el.style.transform='translateY(-26px) scale(1.06)'; });\n  setTimeout(()=>el.remove(),900);\n}\n['pointerdown'].forEach(ev=>flingBtn.addEventListener(ev, e=>{e.preventDefault(); startCharge();}));\n['pointerup','pointercancel','pointerleave'].forEach(ev=>flingBtn.addEventListener(ev, e=>{e.preventDefault(); releaseCharge();}));\n\n/* ============================================================\n   INPUT (play)\n   ============================================================ */\nlet ptr=null;\ncv.addEventListener('pointerdown', e=>{ ptr={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};\n  if (G.mode==='home') startCharge(); });\ncv.addEventListener('pointermove', e=>{\n  if(!ptr || G.mode!=='play') return;\n  const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y;\n  if (!ptr.moved && Math.abs(dx)>26 && Math.abs(dx)>Math.abs(dy)){ ptr.moved=true; setLane(G.lane + (dx>0?1:-1)); }\n  else if (!ptr.moved && dy<-26 && Math.abs(dy)>Math.abs(dx)){ ptr.moved=true; hop(); }\n});\ncv.addEventListener('pointerup', e=>{\n  if (G.mode==='charging'){ releaseCharge(); ptr=null; return; }\n  if (ptr && !ptr.moved && G.mode==='play'){\n    const dt=performance.now()-ptr.t;\n    if (dt<260) useBoost();\n  }\n  ptr=null;\n});\ndocument.getElementById('boostBtn').addEventListener('pointerdown', e=>{ e.stopPropagation(); e.preventDefault(); useBoost(); });\nwindow.addEventListener('keydown', e=>{\n  if (e.repeat) return;\n  if (G.mode==='home' && (e.code==='Space'||e.code==='Enter')){ startCharge(); return; }\n  if (G.mode==='charging' && (e.code==='Space'||e.code==='Enter')){ return; }\n  if (G.mode!=='play') return;\n  if (e.code==='ArrowLeft'||e.code==='KeyA') setLane(G.lane-1);\n  if (e.code==='ArrowRight'||e.code==='KeyD') setLane(G.lane+1);\n  if (e.code==='ArrowUp'||e.code==='KeyW') hop();\n  if (e.code==='Space'||e.code==='ShiftLeft') useBoost();\n});\nwindow.addEventListener('pointerup', ()=>{ if (G.mode==='charging') releaseCharge(); });\nwindow.addEventListener('keyup', e=>{ if ((e.code==='Space'||e.code==='Enter') && G.mode==='charging') releaseCharge(); });\n\n/* ============================================================\n   FIREBASE — leaderboard + reactions\n   ============================================================ */\nconst GAME_ID='puck-rush';\nconst firebaseConfig={\n  apiKey:\"AIzaSyCFW1U5NURzx9zNa0EQAjIJijTGwx4no7E\",\n  authDomain:\"tony-arcade.firebaseapp.com\",\n  projectId:\"tony-arcade\",\n  storageBucket:\"tony-arcade.firebasestorage.app\",\n  messagingSenderId:\"88041829355\",\n  appId:\"1:88041829355:web:56d7048e7c842d14e99fae\",\n  measurementId:\"G-RVYF35QB7W\"\n};\nconst MAX_NAME=10, LB_SIZE=5, MAX_SCORE=99999;\nconst BLOCKED_WORDS=['fuck','shit','cunt','nigg','bitch','rape','slut','dick','porn'];\nlet db=null, fbReady=false, myEntry=null;\nfunction lbStatus(m,err){ const el=document.getElementById('lbStatus'); if(!el) return;\n  el.textContent=m||''; el.style.color=err?'#ff8a8a':'#6f829f'; }\n(function initFB(){\n  if (typeof firebase==='undefined'){ console.warn('[LB] SDK missing'); return; }\n  try{ if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);\n    db=firebase.firestore(); fbReady=true; }\n  catch(e){ console.warn('[LB] init failed',e); }\n})();\nfunction validateName(n){\n  const t=(n||'').trim();\n  if(!t.length) return {valid:false,reason:\"Name can't be empty.\"};\n  if(t.length>MAX_NAME) return {valid:false,reason:'Max '+MAX_NAME+' characters.'};\n  if(BLOCKED_WORDS.some(w=>t.toLowerCase().includes(w))) return {valid:false,reason:'Name not allowed.'};\n  return {valid:true,value:t.replace(/[<>\"'&]/g,'')};\n}\nfunction saneScore(s){ return typeof s==='number' && s>=0 && s<=MAX_SCORE && !isNaN(s); }\nconst Leaderboard={\n  col(){ return db.collection('leaderboards').doc(GAME_ID).collection('scores'); },\n  async top(n=LB_SIZE){\n    if(!fbReady) return [];\n    try{ const snap=await this.col().orderBy('score','desc').limit(n).get();\n      return snap.docs.map(d=>({id:d.id,name:d.data().name||'PLAYER',score:d.data().score||0}));\n    }catch(e){ lbStatus('Could not load scores',true); return []; }\n  },\n  async qualifies(score){\n    if(!fbReady || score<=0) return false;\n    const t=await this.top(LB_SIZE);\n    return t.length<LB_SIZE || score>t[t.length-1].score;\n  },\n  async submit(name,score){\n    if(!fbReady){ lbStatus('Offline — score not saved',true); return false; }\n    try{ const ref=await this.col().add({name,score,timestamp:Date.now(),\n        createdAt:firebase.firestore.FieldValue.serverTimestamp()});\n      myEntry={id:ref.id,name,score}; lbStatus('Score saved ✓'); return true;\n    }catch(e){ lbStatus('Could not save score',true); return false; }\n  }\n};\nasync function renderLB(){\n  const el=document.getElementById('lbRows');\n  const top=await Leaderboard.top(LB_SIZE);\n  if(!top.length){ el.innerHTML='<div style=\"text-align:center;color:#6f829f;font-weight:700;font-size:14px;padding:6px 0\">No runs yet — be first.<\u002Fdiv>'; return; }\n  const medal=['🥇','🥈','🥉'];\n  el.innerHTML=top.map((s,i)=>{\n    const me = myEntry && s.id===myEntry.id;\n    return '<div class=\"lb-row'+(me?' me':'')+'\"><div class=\"lb-rank\">'+(medal[i]||'#'+(i+1))+\n      '<\u002Fdiv><div class=\"lb-name\">'+s.name+'<\u002Fdiv><div class=\"lb-score\">'+s.score+' m<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\nasync function nameEntryIfQualified(score){\n  const c=document.getElementById('nameEntry'); c.innerHTML=''; myEntry=null;\n  if(!saneScore(score)) return;\n  if(!await Leaderboard.qualifies(score)) return;\n  c.innerHTML='<div class=\"ne-label\">🏒 Top-5 run! Add your name<\u002Fdiv>'+\n    '<div class=\"ne-row\"><input id=\"nameIn\" type=\"text\" maxlength=\"'+MAX_NAME+'\" placeholder=\"NAME\" autocomplete=\"off\" '+\n    'autocorrect=\"off\" autocapitalize=\"characters\" spellcheck=\"false\"><button id=\"nameGo\">Save<\u002Fbutton><\u002Fdiv>'+\n    '<div id=\"neErr\" style=\"color:#ff8a8a;font-size:12px;font-weight:700;text-align:center;margin-top:6px\"><\u002Fdiv>';\n  const inp=document.getElementById('nameIn'), btn=document.getElementById('nameGo');\n  const prev=localStorage.getItem('puckrush_name'); if(prev) inp.value=prev;\n  btn.onclick=async()=>{\n    const v=validateName(inp.value);\n    if(!v.valid){ document.getElementById('neErr').textContent=v.reason; return; }\n    btn.disabled=true; btn.textContent='…';\n    localStorage.setItem('puckrush_name',v.value);\n    const ok=await Leaderboard.submit(v.value, Math.floor(score));\n    c.innerHTML = ok ? '<div class=\"ne-done\">✅ Saved to the board<\u002Fdiv>'\n                     : '<div class=\"ne-done\" style=\"color:#ff8a8a\">Could not save — try again later<\u002Fdiv>';\n    renderLB();\n  };\n}\n/* reactions */\nlet hasVoted=false;\nasync function initReactions(){\n  const like=document.getElementById('likeBtn'), meh=document.getElementById('mehBtn');\n  if(fbReady){\n    try{ const d=await db.collection('game_feedback').doc(GAME_ID).get();\n      const v=d.exists?d.data():{likes:0,meh:0};\n      document.getElementById('likeCount').textContent=v.likes||0;\n      document.getElementById('mehCount').textContent=v.meh||0;\n    }catch(e){}\n  }\n  const vote=async(type,btn)=>{\n    if(hasVoted||!fbReady) return; hasVoted=true;\n    like.disabled=true; meh.disabled=true; btn.classList.add('voted');\n    const span=btn.querySelector('span'); span.textContent=(+span.textContent||0)+1;\n    try{ await db.collection('game_feedback').doc(GAME_ID).set(\n      {[type==='like'?'likes':'meh']:firebase.firestore.FieldValue.increment(1)},{merge:true}); }catch(e){}\n  };\n  like.onclick=()=>vote('like',like);\n  meh.onclick=()=>vote('meh',meh);\n}\n\n/* ============================================================\n   SCREENS\n   ============================================================ */\nfunction paintHomeBest(){ document.getElementById('homeTop').innerHTML='Best <b>'+Math.floor(G.best)+' m<\u002Fb>'; }\npaintHomeBest();\nasync function showGameOver(){\n  const d=Math.floor(G.dist);\n  document.getElementById('hud').classList.remove('on');\n  document.getElementById('over').classList.add('on');\n  document.getElementById('overDist').innerHTML=d+'<small>METRES<\u002Fsmall>';\n  document.getElementById('statCoins').textContent=G.coins;\n  document.getElementById('statTop').textContent=Math.round(G.topSpeed*3.6)+' k';\n  const isBest = d>G.best;\n  if(isBest){ G.best=d; localStorage.setItem('puckrush_best',d); paintHomeBest(); }\n  document.getElementById('statBest').textContent=Math.floor(G.best);\n  document.getElementById('newBest').style.display=isBest&&d>0?'block':'none';\n  document.getElementById('overKicker').textContent = isBest ? 'Personal best' : 'Run over';\n  lbStatus('');\n  renderLB(); nameEntryIfQualified(d); initReactions();\n}\ndocument.getElementById('againBtn').onclick=()=>{\n  document.getElementById('over').classList.remove('on');\n  document.getElementById('hud').classList.add('on');\n  G.mode='play'; resetRun(15); toast('GO!');\n};\ndocument.getElementById('homeBtn').onclick=()=>{\n  document.getElementById('over').classList.remove('on');\n  document.getElementById('home').classList.add('on');\n  G.mode='home'; G.power=0; chargeFill.style.right='100%';\n  chargeLabel.textContent='Hold to load your shot';\n  resetRun(0);\n};\n\n/* boot */\nresetRun(0); G.mode='home';\npaintBoost();\nrequestAnimationFrame(rafLoop);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
