  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const reader = ds.readable.getReader();
            writer.write(bytes);

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

--------- HOME ---------- */\n#home{background:linear-gradient(180deg,rgba(3,7,14,.92) 0%,rgba(4,10,20,.55) 36%,rgba(4,10,20,.45) 58%,rgba(3,7,14,.9) 100%)}\n.title{font-weight:800;font-size:clamp(56px,17vw,120px);line-height:.86;color:#fff;letter-spacing:-.02em;\n  text-shadow:0 6px 0 #1b2a4a,0 12px 24px rgba(0,0,0,.45)}\n.title em{font-style:normal;display:block;color:var(--cyan);text-shadow:0 6px 0 #06263a,0 0 40px rgba(77,227,255,.45)}\n.tag{margin-top:14px;font-weight:600;font-size:clamp(13px,3.6vw,17px);color:#8fb2d6;letter-spacing:.16em;text-transform:uppercase}\n.charge-wrap{margin-top:42px;width:min(78vw,340px)}\n.charge-label{font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#cfe0f7;text-align:center;margin-bottom:10px}\n.charge-bar{position:relative;height:24px;border-radius:13px;background:rgba(4,10,20,.8);border:2px solid rgba(120,180,240,.3);overflow:hidden;box-shadow:inset 0 0 18px rgba(0,0,0,.6)}\n.charge-fill{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--cyan),var(--amber) 62%,var(--red));border-radius:11px;transition:right .04s linear}\n.charge-sweet{position:absolute;top:0;bottom:0;left:72%;width:16%;background:rgba(255,255,255,.22);border-left:2px dashed rgba(255,255,255,.55);border-right:2px dashed rgba(255,255,255,.55)}\n.hold-btn{margin-top:26px;pointer-events:auto;border:none;cursor:pointer;font-family:inherit;font-weight:800;\n  font-size:clamp(19px,5vw,24px);letter-spacing:.06em;color:#04121c;background:linear-gradient(180deg,#7defff,#31c9ea);\n  padding:20px 44px;border-radius:18px;box-shadow:0 6px 0 #1a7f99,0 12px 34px rgba(77,227,255,.35);transition:transform .08s,box-shadow .08s}\n.hold-btn.pressed{transform:translateY(5px);box-shadow:0 1px 0 #1a7f99,0 4px 16px rgba(77,227,255,.25)}\n.howto{margin-top:30px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:420px}\n.howto div{font-weight:600;font-size:13px;color:#93aacd;display:flex;align-items:center;gap:7px}\n.kbd{background:rgba(20,40,66,.85);color:#bcd8f5;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700}\n.topscore{margin-top:24px;white-space:nowrap;font-weight:700;font-size:14px;color:#8fa6c8;letter-spacing:.08em}\n.topscore b{color:var(--cyan)}\n\n/* ---------- HUD ---------- */\n#hud{position:absolute;inset:0;display:none}\n#hud.on{display:block}\n.hud-dist{position:absolute;top:calc(12px + env(safe-area-inset-top));left:0;right:0;text-align:center;\n  font-weight:800;font-size:clamp(30px,8.4vw,48px);color:#fff;line-height:.96;\n  text-shadow:0 2px 14px rgba(0,0,0,.6);opacity:.96}\n.hud-dist span{font-size:.30em;letter-spacing:.34em;color:#8fb2d6;display:block;margin-top:3px;font-weight:700}\n.hud-dist::after{content:'';display:block;width:62px;height:2px;margin:7px auto 0;border-radius:2px;\n  background:linear-gradient(90deg,rgba(77,227,255,0),rgba(77,227,255,.55),rgba(77,227,255,0))}\n.hud-left{position:absolute;top:calc(14px + env(safe-area-inset-top));left:calc(58px + env(safe-area-inset-left));display:flex;gap:8px}\n.hud-right{position:absolute;top:calc(14px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:8px}\n.pill{background:var(--glass);border:1px solid rgba(120,180,240,.16);border-radius:11px;padding:6px 11px;\n  display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:#dbeaff;backdrop-filter:blur(8px)}\n.pill i{width:10px;height:10px;border-radius:50%;background:var(--amber);display:block;box-shadow:0 0 10px rgba(255,171,61,.7)}\n.pill.shield i{background:var(--cyan);border-radius:3px;box-shadow:0 0 10px rgba(77,227,255,.8)}\n/* boost meter — segmented, top right, out of the playfield */\n#boostMeter{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid rgba(120,180,240,.16);\n  border-radius:11px;padding:6px 10px;backdrop-filter:blur(8px)}\n#boostMeter svg{width:12px;height:12px;display:block}\n#boostMeter .segs{display:flex;gap:3px}\n#boostMeter .segs b{width:9px;height:11px;border-radius:2px;background:rgba(120,180,240,.18);display:block;transition:background .15s,box-shadow .15s}\n#boostMeter .segs b.on{background:var(--cyan);box-shadow:0 0 8px rgba(77,227,255,.7)}\n#boostMeter.ready .segs b.on{background:#8df3ff}\n#boostMeter .lbl{font-weight:800;font-size:10px;letter-spacing:.18em;color:#7fa5c9}\n#hudZone span{font-size:10px;letter-spacing:.16em;font-weight:800}\n#boostMeter.ready .lbl{color:var(--cyan)}\n#boostWrap{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center}\n#boostBtn{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:none;background:rgba(6,14,26,.42);\n  position:relative;display:grid;place-items:center;font-family:inherit;font-weight:800;color:#9fc4e4;font-size:9px;\n  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:transform .1s,background .2s}\n#boostBtn.ready{background:rgba(77,227,255,.12)}\n#boostBtn.ready .ring{box-shadow:0 0 0 1px rgba(77,227,255,.35),0 0 22px rgba(77,227,255,.35)}\n#boostBtn:active{transform:scale(.93)}\n.ring{position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(140,190,240,.12)}\n#boostArc{position:absolute;inset:0}\n#boostLabel{position:relative;opacity:.55}\n#boostBtn.ready #boostLabel{opacity:1;color:var(--cyan)}\n\n/* ---------- GAME OVER ---------- */\n#over{background:rgba(3,8,16,.92);backdrop-filter:blur(10px);justify-content:flex-start;overflow-y:auto}\n.over-card{width:min(94vw,400px);display:flex;flex-direction:column;align-items:center;margin:auto 0}\n.over-kicker{font-weight:700;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--red)}\n.over-dist{font-weight:800;font-size:clamp(64px,20vw,104px);line-height:.9;color:#fff;margin-top:4px}\n.over-dist small{font-size:.28em;letter-spacing:.16em;color:#8fa6c8;display:block;margin-top:4px;font-weight:700}\n.over-stats{display:flex;gap:10px;margin-top:16px;width:100%}\n.stat{flex:1;background:rgba(255,255,255,.07);border-radius:16px;padding:11px 8px;text-align:center}\n.stat b{display:block;font-size:22px;color:#fff;font-weight:800;line-height:1.1}\n.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8fa6c8;font-weight:700}\n.newbest{margin-top:12px;font-weight:800;color:var(--cyan);font-size:15px;letter-spacing:.1em;text-transform:uppercase}\n#nameEntry{width:100%;margin-top:16px}\n.ne-label{font-weight:800;font-size:14px;color:var(--cyan);text-align:center;margin-bottom:8px;letter-spacing:.05em}\n.ne-row{display:flex;gap:8px}\n.ne-row input{flex:1;min-height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);\n  color:#fff;font-family:inherit;font-weight:700;font-size:17px;padding:0 14px;text-transform:uppercase;outline:none}\n.ne-row input:focus{border-color:var(--cyan)}\n.ne-row button{min-height:48px;padding:0 20px;border:none;border-radius:14px;background:var(--cyan);color:#04121c;\n  font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}\n.ne-done{text-align:center;font-weight:700;color:var(--mint);font-size:14px}\n.lb{width:100%;margin-top:18px;background:rgba(255,255,255,.06);border-radius:18px;padding:14px 14px 10px}\n.lb-title{font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#8fa6c8;text-align:center;margin-bottom:10px}\n.lb-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:10px;font-weight:700;color:#dfe9f8}\n.lb-row.me{background:rgba(77,227,255,.16);color:#fff}\n.lb-rank{width:26px;text-align:center;font-size:15px;color:#8fa6c8}\n.lb-name{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.lb-score{font-size:15px;font-variant-numeric:tabular-nums}\n#lbStatus{font-size:11px;color:#6f829f;text-align:center;margin-top:6px;font-weight:600;min-height:14px}\n.react{display:flex;gap:10px;margin-top:16px}\n.react \n  <svg id=\"iconMute\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6f829f\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:none\">\n    <polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\u002Fpolygon><line x1=\"17\" y1=\"9\" x2=\"22\" y2=\"15\"><\u002Fline><line x1=\"22\" y1=\"9\" x2=\"17\" y2=\"15\"><\u002Fline>\n  <\u002Fsvg>\n<\u002Fbutton>\n\n<div id=\"ui\">\n  <!-- HOME -->\n  <div class=\"screen on\" id=\"home\">\n    <h1 class=\"title\">PUCK<em>RUSH<\u002Fem><\u002Fh1>\n    <div class=\"tag\">Fling it. Dodge everything.<\u002Fdiv>\n    <div class=\"charge-wrap\">\n      <div class=\"charge-label\" id=\"chargeLabel\">Hold to load your shot<\u002Fdiv>\n      <div class=\"charge-bar\"><div class=\"charge-sweet\"><\u002Fdiv><div class=\"charge-fill\" id=\"chargeFill\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"hold-btn\" id=\"flingBtn\">HOLD &amp; RELEASE<\u002Fbutton>\n    <div class=\"howto\">\n      <div><span class=\"kbd\">swipe ◀ ▶<\u002Fspan> change lane<\u002Fdiv>\n      <div><span class=\"kbd\">swipe ▲<\u002Fspan> hop<\u002Fdiv>\n      <div><span class=\"kbd\">tap<\u002Fspan> boost<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"topscore\" id=\"homeTop\">Best <b>0 m<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HUD -->\n  <div id=\"hud\">\n    <div class=\"hud-dist\" id=\"hudDist\">0<span>METRES<\u002Fspan><\u002Fdiv>\n    <div class=\"hud-left\">\n      <div class=\"pill\"><i><\u002Fi><span id=\"hudCoins\">0<\u002Fspan><\u002Fdiv>\n      <div class=\"pill\" id=\"hudZone\"><i id=\"hudZoneDot\"><\u002Fi><span id=\"hudZoneName\">DEEP FREEZE<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hud-right\">\n      <div id=\"boostMeter\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4de3ff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 4 14 11 14 10 22 20 9 13 9 13 2\" fill=\"#4de3ff\" stroke=\"none\"><\u002Fpolygon><\u002Fsvg>\n        <span class=\"lbl\">BOOST<\u002Fspan>\n        <span class=\"segs\"><b><\u002Fb><b><\u002Fb><b><\u002Fb><b><\u002Fb><b><\u002Fb><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"pill shield\" id=\"hudShield\" style=\"display:none\"><i><\u002Fi><span>SHIELD<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"boostWrap\">\n      <button id=\"boostBtn\" aria-label=\"Boost\">\n        <canvas id=\"boostArc\"><\u002Fcanvas>\n        <div class=\"ring\"><\u002Fdiv>\n        <span id=\"boostLabel\">Boost<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- GAME OVER -->\n  <div class=\"screen\" id=\"over\">\n    <div class=\"over-card\">\n      <div class=\"over-kicker\" id=\"overKicker\">Run over<\u002Fdiv>\n      <div class=\"over-dist\" id=\"overDist\">0<small>METRES<\u002Fsmall><\u002Fdiv>\n      <div class=\"over-stats\">\n        <div class=\"stat\"><b id=\"statBest\">0<\u002Fb><span>Best<\u002Fspan><\u002Fdiv>\n        <div class=\"stat\"><b id=\"statCoins\">0<\u002Fb><span>Coins<\u002Fspan><\u002Fdiv>\n        <div class=\"stat\"><b id=\"statTop\">0<\u002Fb><span>Top speed<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"newbest\" id=\"newBest\" style=\"display:none\">New personal best!<\u002Fdiv>\n      <div id=\"nameEntry\"><\u002Fdiv>\n      <div class=\"lb\"><div class=\"lb-title\">🏆 Top Runs<\u002Fdiv><div id=\"lbRows\"><\u002Fdiv><div id=\"lbStatus\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"react\">\n        <button id=\"likeBtn\">👍 <span id=\"likeCount\">0<\u002Fspan><\u002Fbutton>\n        <button id=\"mehBtn\">😐 <span id=\"mehCount\">0<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"again\" id=\"againBtn\">GO AGAIN<\u002Fbutton>\n      <button class=\"homelink\" id=\"homeBtn\">Title screen<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ============================================================\n   PUCK RUSH — endless hockey-puck runner\n   ============================================================ */\nconst cv = document.getElementById('gc'), ctx = cv.getContext('2d');\nlet W = 0, H = 0, DPR = 1;\nfunction resize(){\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  W = window.innerWidth; H = window.innerHeight;\n  cv.width = W * DPR; cv.height = H * DPR;\n  cv.style.width = W + 'px'; cv.style.height = H + 'px';\n  ctx.setTransform(DPR,0,0,DPR,0,0);\n  const b = document.getElementById('boostArc');\n  b.width = 76 * DPR; b.height = 76 * DPR;\n  b.style.width = '76px'; b.style.height = '76px';\n}\nwindow.addEventListener('resize', resize); resize();\n\n/* ---------- palette ---------- */\nconst C = {\n  // dark arena base\n  bgTop:'#04080f', bgMid:'#081426', horizon:'#122741', haze:'#1d4a75',\n  iceFar:'#0c1a2d', iceMid:'#14273f', iceNear:'#1c3452',\n  boardFace:'#1c3050', boardTop:'#24406a', boardDark:'#0c1728',\n  slab:'#101d33', slabTop:'#182b47',\n  // neon accents (limited palette)\n  neonRed:'#ff3b47', neonBlue:'#2f8bff', neonCyan:'#4de3ff', amber:'#ffab3d',\n  white:'#eaf4ff', ink:'#050a14',\n  frost:'#bfe4ff', pit:'#050a14',\n  puck:'#0c1018', puckTop:'#19202f', rim:'#4de3ff',\n  // legacy aliases (used by particles / makeEnt / CSS parity)\n  red:'#ff3b47', blue:'#2f8bff', yellow:'#ffab3d', mint:'#4de3ff', pink:'#ff6b8a',\n  snow:'#bfe4ff', hole:'#050a14', stick:'#ffab3d', stickTape:'#0a1425',\n  seam:'rgba(120,180,240,.14)', boardW:'#132139', boardBase:'#0f1c31'\n};\n\n/* ---------- zones: each fork drops you into one of these ---------- */\nconst THEMES = {\n  ice: { key:'ice', name:'DEEP FREEZE',\n    bgTop:'#04080f', bgMid:'#081426', horizon:'#122741', hazeCol:'#3c8cdc', light:'#b4dcff',\n    iceFar:'#16304f', iceMid:'#1b3c62', iceNear:'#122a48',\n    boardTop:'#24406a', boardFace:'#1c3050', ledA:'#ff3b47', ledB:'#2f8bff',\n    mote:{col:'#dff1ff', rise:-0.22, size:0.020, rate:12}, tunnel:0,\n    tag:'Wide gaps, but snow drifts everywhere',\n    play:{speed:1.0, gap:1.06, steer:8.5, gauge:1.0, dbl:0.0, w:{wall:2,drift:3,hole:2,stick:2,ramp:1}} },\n  tunnel: { key:'tunnel', name:'THE TUNNEL',\n    bgTop:'#08040f', bgMid:'#170a2b', horizon:'#2b1149', hazeCol:'#a24dff', light:'#e2c6ff',\n    iceFar:'#22143c', iceMid:'#2a1a4a', iceNear:'#1a1030',\n    boardTop:'#3c1e66', boardFace:'#2a1049', ledA:'#c34dff', ledB:'#4de3ff',\n    mote:{col:'#e0b6ff', rise:0.10, size:0.017, rate:30}, tunnel:1,\n    tag:'Tight and twitchy — boost recharges fast',\n    play:{speed:0.93, gap:0.78, steer:12.5, gauge:1.45, dbl:0.18, w:{wall:4,drift:1,hole:2,stick:4,ramp:1}} },\n  ember: { key:'ember', name:'THE FURNACE',\n    bgTop:'#100500', bgMid:'#2a0f04', horizon:'#4a1e08', hazeCol:'#ff8c3c', light:'#ffd9a3',\n    iceFar:'#3a2010', iceMid:'#452712', iceNear:'#28160a',\n    boardTop:'#6b3312', boardFace:'#4d240c', ledA:'#ffab3d', ledB:'#ff3b47',\n    mote:{col:'#ffb46b', rise:0.55, size:0.021, rate:24}, tunnel:0,\n    tag:'Fast and jumpy — big air, big gaps',\n    play:{speed:1.15, gap:1.18, steer:11, gauge:0.9, dbl:-0.06, w:{wall:2,drift:0,hole:3,stick:1,ramp:4}} }\n};\nconst ZONE_KEYS = ['ice','tunnel','ember'];\nfunction ZP(){ return (THEMES[G.zone]||THEMES.ice).play; }\nfunction pickType(){\n  const w=ZP().w, keys=Object.keys(w);\n  let total=0; for(const k of keys) total+=w[k];\n  let r=Math.random()*total;\n  for(const k of keys){ r-=w[k]; if(r<=0) return k; }\n  return 'wall';\n}\nconst TH = Object.assign({}, THEMES.ice);\nfunction hexA(hex,a){ const n=parseInt(hex.slice(1),16);\n  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }\nfunction lerpTheme(dt){\n  const T=THEMES[G.zone||'ice'], k=Math.min(1,dt*1.2);\n  for(const key of ['bgTop','bgMid','horizon','hazeCol','light','iceFar','iceMid','iceNear','boardTop','boardFace','ledA','ledB'])\n    TH[key]=mix(TH[key],T[key],k);\n  TH.tunnel += (T.tunnel - TH.tunnel)*k;\n  TH.mote=T.mote; TH.name=T.name; TH.key=T.key;\n}\n/* track bend — a fork swings the whole corridor the way you went */\nfunction bendX(z){\n  let b=0;\n  for(let i=0;i<G.bends.length;i++){ const bd=G.bends[i];\n    const t=Math.min(1,Math.max(0,(z-bd.z0)/bd.len));\n    b += bd.dir*bd.amp*(t*t*(3-2*t));\n  }\n  return b;\n}\n\n/* ---------- world constants ---------- */\nconst LANES = [-1.05, 0, 1.05];\nconst RINK = 1.72;              // board x\nconst CAM = { x:0, y:0.36, z:-2.0, shake:0 };\nconst HORIZON_F = 0.46;\nlet f = 0;                       // focal length, set per frame\n\n/* ---------- game state ---------- */\nconst G = {\n  mode:'home',                   // home | charging | play | dead\n  t:0, dist:0, speed:0, targetSpeed:0, topSpeed:0,\n  lane:1, px:0, py:0, vy:0, air:false, spin:0, tilt:0,\n  coins:0, shield:false, slow:0, boostT:0, gauge:1, ready:true,\n  ents:[], parts:[], spawnZ:14, props:[], propZ:0,\n  crashT:0, best:+(localStorage.getItem('puckrush_best')||0), power:0, dir:1, launchGrade:''\n};\n\n/* ---------- projection ---------- */\nfunction proj(x,y,z){\n  const dz = z - CAM.z;\n  if (dz < 0.28) return null;\n  const s = f/dz;\n  return { x: W/2 + ((x + bendX(z)) - (CAM.x + bendX(CAM.z)))*s, y: H*HORIZON_F + (CAM.y - y)*s, s };\n}\nfunction quad(a,b,c,d,fill,stroke,lw){\n  if(!a||!b||!c||!d) return;\n  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath();\n  if(fill){ ctx.fillStyle = fill; ctx.fill(); }\n  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1.4; ctx.stroke(); }\n}\n// axis-aligned box: centre x, base y0, near z, size w/h/d\nfunction box(x,y0,z,w,h,d,front,top,side){\n  const zf=z, zb=z+d, x1=x-w/2, x2=x+w/2, y1=y0, y2=y0+h;\n  const A=proj(x1,y2,zf), B=proj(x2,y2,zf), Cc=proj(x2,y1,zf), D=proj(x1,y1,zf);\n  const E=proj(x1,y2,zb), F=proj(x2,y2,zb), Gg=proj(x2,y1,zb), Hh=proj(x1,y1,zb);\n  quad(E,F,Gg,Hh, front, null);                                   // back (dim)\n  if (side){                                                       // one visible side\n    if (x > CAM.x) quad(A,E,Hh,D, side, C.ink, 1.2);\n    else quad(B,F,Gg,Cc, side, C.ink, 1.2);\n  }\n  quad(A,B,Cc,D, front, C.ink, 1.6);                               // front\n  if (top) quad(E,F,B,A, top, C.ink, 1.4);                         // top\n}\nfunction flat(x,z,w,d,fill,stroke){\n  const A=proj(x-w/2,0,z+d), B=proj(x+w/2,0,z+d), Cc=proj(x+w/2,0,z), D=proj(x-w/2,0,z);\n  quad(A,B,Cc,D, fill, stroke, 1.4);\n}\n\n/* ---------- audio ---------- */\nlet AC=null, sound = localStorage.getItem('puckrush_mute')!=='1';\nfunction ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }\nfunction tone(fr,dur,type='sine',vol=.14,slide=0){\n  if(!sound) return; const c=ac(); if(!c) return;\n  const o=c.createOscillator(), g=c.createGain();\n  o.type=type; o.frequency.setValueAtTime(fr,c.currentTime);\n  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,fr*slide), c.currentTime+dur);\n  g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);\n  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);\n}\nfunction noise(dur=.3,vol=.2){\n  if(!sound) return; const c=ac(); if(!c) return;\n  const n=c.sampleRate*dur, buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);\n  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);\n  const s=c.createBufferSource(), g=c.createGain(), fl=c.createBiquadFilter();\n  fl.type='lowpass'; fl.frequency.value=1400;\n  s.buffer=buf; g.gain.value=vol; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start();\n}\nconst sfx = {\n  swipe:()=>tone(420,.08,'triangle',.07,1.5),\n  hop:()=>tone(520,.16,'sine',.1,1.8),\n  land:()=>noise(.12,.12),\n  coin:()=>{tone(880,.07,'square',.07);setTimeout(()=>tone(1320,.09,'square',.06),55)},\n  boost:()=>{tone(260,.35,'sawtooth',.09,4);noise(.35,.1)},\n  shield:()=>{tone(660,.18,'sine',.09);setTimeout(()=>tone(990,.22,'sine',.07),90)},\n  drift:()=>noise(.28,.14),\n  crash:()=>{noise(.5,.3);tone(160,.5,'sawtooth',.14,.3)},\n  fling:()=>{tone(180,.5,'sawtooth',.12,6);noise(.4,.16)},\n  charge:()=>tone(300,.05,'sine',.03)\n};\nconst muteBtn=document.getElementById('muteBtn');\nfunction paintMute(){ document.getElementById('iconSound').style.display = sound?'block':'none';\n  document.getElementById('iconMute').style.display = sound?'none':'block'; }\nmuteBtn.onclick = e => { e.stopPropagation(); sound=!sound; localStorage.setItem('puckrush_mute',sound?'0':'1'); paintMute(); };\npaintMute();\n\n/* ============================================================\n   WORLD GENERATION\n   ============================================================ */\nconst TYPES = ['wall','wall','drift','hole','stick','ramp'];\nfunction spawnAhead(){\n  while (G.spawnZ < G.px_z() + 90){\n    // a fork every ~340m: centre lane walled off, two lit branches — you must choose\n    if (G.spawnZ + 12 > G.nextForkZ){\n      const z = G.nextForkZ;\n      const pair = [];\n      while (pair.length < 2){\n        const k = ZONE_KEYS[Math.floor(Math.random()*ZONE_KEYS.length)];\n        if (!pair.includes(k) && k !== G.zone) pair.push(k);\n        if (pair.length===1 && ZONE_KEYS.every(x=>x===G.zone||pair.includes(x))) pair.push(G.zone);\n      }\n      // clear a runway so the choice is never a trap\n      G.ents = G.ents.filter(en => en.z < z-15 || en.z > z+18);\n      G.ents.push({type:'fork', lane:1, z, left:pair[0], right:pair[1], done:false, hit:true});\n      G.ents.push(makeEnt('wall',1,z)); // the choice is forced\n      G.ents[G.ents.length-1].h = 1.35;\n      G.ents[G.ents.length-1].isForkWall = true;\n      G.nextForkZ = z + 300 + Math.random()*120;\n      G.spawnZ = z + 15;\n      continue;\n    }\n    const d = G.dist;\n    const gap = (Math.max(6.4, 14 - d/170) + Math.random()*3.6) * ZP().gap;\n    G.spawnZ += gap;\n    const z = G.spawnZ;\n    // difficulty: how many lanes are blocked\n    const hard = Math.min(1, d/900);\n    const blockCount = Math.random() < .25 + hard*.35 + ZP().dbl ? 2 : 1;\n    const lanes = [0,1,2].sort(()=>Math.random()-.5).slice(0, blockCount);\n    const kind = pickType();\n    lanes.forEach((l,i)=>{\n      const k = i===0 ? kind : pickType();\n      if (k==='ramp' && i>0) return;\n      const zz = z + (Math.random()*.6-.3);\n      G.ents.push(makeEnt(k, l, zz));\n      // a ramp gets air rings on its landing arc — fly through them for a token payout\n      if (k==='ramp' && Math.random()<0.8){\n        const lip = zz + 1.5;\n        const n = Math.random()<0.45 ? 2 : 1;\n        for(let r=0;r<n;r++){\n          G.ents.push({type:'ring', lane:l, z: lip + 3.6 + r*3.4 + Math.random()*1.2,\n            y: 1.02 + r*0.14, rad: 0.52 + Math.random()*0.1,\n            got:false, missed:false, pop:0, reward:5});\n        }\n      }\n    });\n    // pickups in a free lane\n    const free = [0,1,2].filter(l=>!lanes.includes(l));\n    if (free.length){\n      const l = free[Math.floor(Math.random()*free.length)];\n      const r = Math.random();\n      if (r < .58){\n        const n = 2 + Math.floor(Math.random()*3);\n        for(let i=0;i<n;i++) G.ents.push({type:'coin',lane:l,z:z+i*2.3, y:0.34, got:false});\n      } else if (r < .78){\n        G.ents.push({type:'boost',lane:l,z:z,y:0.3,got:false});\n      } else if (r < .9){\n        G.ents.push({type:'shieldup',lane:l,z:z,y:0.4,got:false});\n      }\n    }\n  }\n}\nfunction makeEnt(type,lane,z){\n  const e = { type, lane, z, hit:false, got:false };\n  if (type==='wall'){ e.h = 1.02 + Math.random()*0.26; }\n  if (type==='drift'){ e.h = 0.3; }\n  if (type==='hole'){ e.d = 1.5 + Math.random(); }\n  if (type==='stick'){ e.rot = Math.random()<.5; }\n  if (type==='ramp'){ e.h = 0.55; }\n  return e;\n}\n/* big background props (crowd stacks, giant sticks, banners) */\nfunction spawnProps(){\n  while (G.propZ < G._z + 170){\n    G.propZ += 8 + Math.random()*6;\n    const side = Math.random()<.5 ? -1 : 1;\n    const r = Math.random();\n    const neon = [C.neonCyan, C.neonBlue, C.amber, '#c34dff'][Math.floor(Math.random()*4)];\n    if (r < .34){\n      // chunky block tower with fat vertical neon bars\n      G.props.push({type:'tower', x: side*(4.0+Math.random()*3.0), z:G.propZ,\n        h: 1.8+Math.random()*3.4, w: 1.3+Math.random()*1.4, col:neon,\n        bars: 1+Math.floor(Math.random()*2)});\n    } else if (r < .58){\n      // mushroom disc on a lit mast — the playful landmark\n      G.props.push({type:'disc', x: side*(3.0+Math.random()*1.8), z:G.propZ,\n        h: 2.4+Math.random()*1.6, rad: 0.85+Math.random()*0.5, col:C.neonCyan});\n    } else if (r < .82){\n      // squat glow pylon\n      G.props.push({type:'pylon', x: side*(2.25+Math.random()*0.5), z:G.propZ,\n        h: 1.6+Math.random()*1.4, col: Math.random()<.5?C.amber:C.neonCyan});\n    } else {\n      G.props.push({type:'arch', x:0, z:G.propZ, h: 2.5+Math.random()*0.6, col:C.neonCyan});\n    }\n  }\n}\n/* ============================================================\n   RENDER\n   ============================================================ */\nfunction mix(a,b,t){\n  const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);\n  const r=Math.round(((A>>16)&255)*(1-t)+((B>>16)&255)*t);\n  const g=Math.round(((A>>8)&255)*(1-t)+((B>>8)&255)*t);\n  const bl=Math.round((A&255)*(1-t)+(B&255)*t);\n  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);\n}\nfunction shade(hex,amt){\n  const n=parseInt(hex.slice(1),16);\n  const r=Math.max(0,Math.min(255,(n>>16)+amt)), g=Math.max(0,Math.min(255,((n>>8)&255)+amt)), b=Math.max(0,Math.min(255,(n&255)+amt));\n  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);\n}\n/* atmospheric perspective: everything fades toward the horizon haze */\nfunction icernd(seed){ const x=Math.sin(seed*127.1+seed*seed*0.013)*43758.5453; return x-Math.floor(x); }\nfunction fogT(z){ return Math.min(1, Math.max(0, (z - CAM.z) / 78)); }\nfunction fogc(hex,z,k){ return mix(hex, TH.horizon, fogT(z)*(k===undefined?0.92:k)); }\nfunction fogA(z,base){ return (base===undefined?1:base) * (1 - fogT(z)*0.85); }\n/* overhead light rig — the main speed cue */\nfunction lightZs(){\n  const out=[], z0=Math.floor((CAM.z+1.5)/8)*8;\n  for(let i=11;i>=0;i--) out.push(z0+i*8);\n  return out;\n}\nfunction contactShadow(x,z,w,d,a){\n  if (z < CAM.z+2.6) return;\n  const t=proj(x,0,z+d*0.5); if(!t) return;\n  const rx=Math.min(W*0.3,t.s*w*0.62), ry=Math.min(H*0.12,t.s*d*0.16+2);\n  const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,Math.max(rx,ry));\n  const al=(a===undefined?0.5:a)*fogA(z,1);\n  g.addColorStop(0,'rgba(2,6,14,'+al+')'); g.addColorStop(1,'rgba(2,6,14,0)');\n  ctx.save(); ctx.translate(t.x,t.y); ctx.scale(1, Math.max(0.12, ry/Math.max(rx,ry)));\n  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,Math.max(rx,ry),0,7); ctx.fill(); ctx.restore();\n}\n/* one glowing line segment in world space */\nfunction neonLine(x1,y1,z1,x2,y2,z2,col,wid,glow){\n  const a=proj(x1,y1,z1), b=proj(x2,y2,z2); if(!a||!b) return;\n  const al=fogA(z1,1);\n  if(glow && al>0.35){\n    ctx.globalAlpha=al*0.22; ctx.strokeStyle=col; ctx.lineWidth=Math.min(wid*3.6, 13); ctx.lineCap='round';\n    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();\n  }\n  ctx.globalAlpha=al; ctx.strokeStyle=col; ctx.lineWidth=Math.min(wid,6); ctx.lineCap='butt';\n  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();\n  ctx.globalAlpha=1;\n}\n\nfunction zSamples(zN,zF,n){\n  const out=[];\n  for(let i=0;i<=n;i++){\n    const k=i/n;\n    out.push(zN + (zF-zN)*(k*k*0.85 + k*0.15));   // denser near the camera\n  }\n  return out;\n}\nfunction runLine(x,y,zN,zF,width,blockLen,colA,colB,alphaK){\n  const zs=zSamples(zN,zF,26);\n  const pts=[];\n  for(const z of zs){ const pt=proj(x,y,z); if(pt) pts.push({p:pt,z}); }\n  if(pts.length<2) return;\n  const a=pts[0].p, b=pts[pts.length-1].p;\n  const rgba=(hex,al)=>{const n=parseInt(hex.slice(1),16);\n    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+al.toFixed(3)+')';};\n  ctx.lineWidth=width; ctx.lineCap='butt'; ctx.lineJoin='round';\n  if(blockLen){\n    // walk the polyline, stroking each span in its block colour — follows the bend\n    for(let i=0;i<pts.length-1;i++){\n      const zm=(pts[i].z+pts[i+1].z)/2;\n      const k=Math.floor(zm/blockLen);\n      const col=(k%2===0)?colA:colB;\n      const al=alphaK*fogA(zm,1);\n      if(al<=0.01) continue;\n      ctx.strokeStyle=rgba(col,al);\n      ctx.beginPath(); ctx.moveTo(pts[i].p.x,pts[i].p.y); ctx.lineTo(pts[i+1].p.x,pts[i+1].p.y); ctx.stroke();\n    }\n  } else {\n    const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);\n    g.addColorStop(0, rgba(colA, alphaK*fogA(zN,1)));\n    g.addColorStop(0.4, rgba(colA, alphaK*fogA(zN+22,1)));\n    g.addColorStop(1, rgba(colA, 0));\n    ctx.strokeStyle=g;\n    ctx.beginPath(); ctx.moveTo(pts[0].p.x,pts[0].p.y);\n    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].p.x,pts[i].p.y);\n    ctx.stroke();\n  }\n}\nfunction drawSky(){\n  const hy=H*HORIZON_F;\n  const g=ctx.createLinearGradient(0,0,0,hy+2);\n  g.addColorStop(0,TH.bgTop); g.addColorStop(.62,TH.bgMid); g.addColorStop(1,TH.horizon);\n  ctx.fillStyle=g; ctx.fillRect(0,0,W,hy+2);\n  // vanishing-point haze\n  const vp=proj(0,0.4,CAM.z+60);\n  if(vp){ const rg=ctx.createRadialGradient(vp.x,hy,0,vp.x,hy,Math.min(W,H)*0.42);\n    rg.addColorStop(0,hexA(TH.hazeCol,.34)); rg.addColorStop(1,hexA(TH.hazeCol,0));\n    ctx.fillStyle=rg; ctx.fillRect(0,0,W,hy+H*0.1); }\n  // ceiling light bars, far -> near\n  for(const z of lightZs()){\n    if(z < CAM.z+6) continue;\n    const t=proj(0,2.75,z+0.2); if(!t) continue;\n    const al=fogA(z,1); if(al<=0.02) continue;\n    const bw=Math.min(W*0.9,t.s*0.9), bh=Math.max(1.2,Math.min(10,t.s*0.03));\n    // two soft haloes for a gentler falloff than a single hard pool\n    for(const L of [{r:1.5,a:0.10},{r:0.9,a:0.16}]){\n      const rg=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,bw*L.r);\n      rg.addColorStop(0,hexA(TH.light,L.a*al)); rg.addColorStop(0.5,hexA(TH.light,L.a*al*0.4));\n      rg.addColorStop(1,hexA(TH.light,0));\n      ctx.fillStyle=rg; ctx.beginPath(); ctx.ellipse(t.x,t.y,bw*0.85*L.r,bw*0.28*L.r,0,0,7); ctx.fill();\n    }\n    if(z > CAM.z+12){\n      const cone=ctx.createLinearGradient(t.x,t.y,t.x,t.y+bw*0.9);\n      cone.addColorStop(0,hexA(TH.light,0.09*al)); cone.addColorStop(1,hexA(TH.light,0));\n      ctx.fillStyle=cone;\n      ctx.beginPath(); ctx.moveTo(t.x-bw*0.42,t.y); ctx.lineTo(t.x+bw*0.42,t.y);\n      ctx.lineTo(t.x+bw*0.85,t.y+bw*0.9); ctx.lineTo(t.x-bw*0.85,t.y+bw*0.9); ctx.closePath(); ctx.fill();\n    }\n    ctx.fillStyle=hexA(TH.light,0.35*al);\n    ctx.beginPath(); ctx.ellipse(t.x,t.y,bw*0.52,bh*1.5,0,0,7); ctx.fill();\n    ctx.fillStyle=hexA('#ffffff',0.9*al);\n    ctx.beginPath(); ctx.ellipse(t.x,t.y,bw*0.36,bh*0.6,0,0,7); ctx.fill();\n  }\n  // upper truss band\n  ctx.fillStyle=hexA(TH.bgTop,.85); ctx.fillRect(0,hy-H*.045,W,H*.048);\n}\nfunction drawIce(){\n  const hy=H*HORIZON_F;\n  const g=ctx.createLinearGradient(0,hy,0,H);\n  g.addColorStop(0,TH.iceFar); g.addColorStop(.3,TH.iceMid); g.addColorStop(1,TH.iceNear);\n  ctx.fillStyle=g; ctx.fillRect(0,hy,W,H-hy);\n  // light pools under each ceiling bar (grounds the rig, adds dimension)\n  for(const z of lightZs()){\n    if(z < CAM.z+5) continue;\n    const t=proj(0,0,z+0.4); if(!t) continue;\n    const al=fogA(z,1)*0.5; if(al<=0.02) continue;\n    const rx=t.s*1.5, ry=t.s*0.5;\n    const rg=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,rx);\n    rg.addColorStop(0,hexA(TH.light,al*0.34)); rg.addColorStop(1,hexA(TH.light,0));\n    ctx.save(); ctx.translate(t.x,t.y); ctx.scale(1,ry/rx); ctx.fillStyle=rg;\n    ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.fill(); ctx.restore();\n  }\n  // transverse surface seams — repeating detail that reads as motion\n  const base=Math.floor((CAM.z+0.4)/2.5)*2.5;\n  for(let i=30;i>=0;i--){\n    const z=base+i*2.5, a=proj(-RINK,0,z), b=proj(RINK,0,z), c=proj(RINK,0,z+0.09), d=proj(-RINK,0,z+0.09);\n
